<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตัวอย่างเมนูแอดมินและตารางงาน</title>
<style>
  :root { --bg:#f4f6f8; --surface:#fff; --surface-2:#f9fafb; --text:#202936; --muted:#667085; --border:#e0e5eb; --control:#858f9e; --accent:#2457c5; --selected:#eef3fc; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,sans-serif; }
  body.team { font-size:16px; }
  a { color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .skip { position:absolute; top:.75rem; left:.75rem; z-index:3; background:var(--surface); padding:.75rem; transform:translateY(-200%); }
  .skip:focus { transform:none; }
  aside { padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--border); }
  aside img { display:block; max-width:100%; width:168px; height:auto; }
  main { min-width:0; width:100%; max-width:1216px; margin:auto; padding:24px; }
  h1 { font-size:24px; line-height:1.3; margin:0; }
  h2 { font-size:18px; margin:0; }
  p { margin:0; }
  .sub { color:var(--muted); margin-top:4px; }
  .header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
  button, summary { font:inherit; cursor:pointer; }
  .button, summary { color:var(--accent); background:var(--surface); border:1px solid var(--control); border-radius:6px; min-height:44px; padding:10px 12px; font-weight:600; }
  .mobile-header { position:relative; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .mobile-links { position:absolute; background:var(--surface); inset-inline:0; z-index:2; padding:8px 12px 16px; border:1px solid var(--border); border-radius:8px; }
  .desktop-nav { display:none; }
  details nav { margin:12px 0 4px; }
  nav h2 { font-size:13px; color:var(--muted); margin:12px 0 4px; }
  nav ul { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:2px; list-style:none; margin:0; padding:0; }
  nav a { display:flex; align-items:center; min-height:44px; padding:8px; text-decoration:none; color:var(--text); border-radius:6px; }
  nav a[aria-current] { background:var(--selected); color:var(--accent); font-weight:600; }
  .account { border-top:1px solid var(--border); margin-top:12px; padding-top:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:12px; margin:20px 0; }
  .card, .region { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px; }
  .card strong { display:block; font-size:24px; margin-top:4px; }
  .warning { color:#9a4106; }
  .filters { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:16px; }
  .filters input[type="search"], .filters select { min-height:36px; max-width:100%; border:1px solid var(--control); border-radius:6px; padding:6px 8px; background:var(--surface); color:var(--text); font:inherit; }
  .card-row { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; margin-top:12px; }
  .week { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
  .table-scroll { overflow-x:auto; border:1px solid var(--border); border-radius:8px; background:var(--surface); margin-top:8px; }
  table { border-collapse:separate; border-spacing:0; min-width:720px; width:100%; text-align:left; }
  th, td { padding:10px; vertical-align:top; border-bottom:1px solid var(--border); }
  thead th { background:var(--surface-2); color:var(--muted); }
  th:first-child { position:sticky; left:0; width:100px; background:var(--surface); border-right:1px solid var(--border); }
  thead th:first-child { background:var(--surface-2); }
  td a { display:block; padding:8px 0; }
  .scroll-help { color:var(--muted); font-size:14px; }
  .team main { padding-inline:16px; }
  .team-top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; }
  .team-top > a { display:inline-flex; min-height:48px; align-items:center; }
  .team-top details { position:relative; }
  .team-top details div { position:absolute; right:0; top:100%; z-index:2; padding:12px; white-space:nowrap; border:1px solid var(--border); background:var(--surface); border-radius:6px; }
  @media(min-width:1024px) {
    body.admin { display:grid; grid-template-columns:240px minmax(0,1fr); min-height:100vh; }
    .admin main { margin:0 auto; }
    .admin aside { border-right:1px solid var(--border); border-bottom:0; padding:20px 12px; }
    .admin aside img { width:216px; }
    .mobile-nav { display:none; }
    .desktop-nav { display:block; }
    nav ul { grid-template-columns:1fr; }
    nav a { min-height:40px; }
    .team { font-size:14px; }
    .team main { padding:24px; }
    .scroll-help { display:none; }
  }
</style>
</head>
<body>
<a class="skip" href="#content">ข้ามไปเนื้อหาหลัก</a>
<template id="admin">
  <aside>
    <div class="mobile-header">
      <img src="../../../frontend/src/shared/assets/project-logo.png" alt="Janitorial Management Dashboard">
      <details class="mobile-nav"><summary>เมนูแอดมิน</summary><div class="mobile-links"></div></details>
    </div>
    <div class="desktop-nav"></div>
  </aside>
  <main id="content" tabindex="-1">
    <header class="header">
      <div><h1>สถานะจุดทำความสะอาด</h1><p class="sub">1 พื้นที่ · 1 จุด</p></div>
      <p class="warning">กำลังเชื่อมต่อใหม่ ข้อมูลอาจยังไม่ล่าสุด</p>
    </header>
    <div class="grid" aria-label="สรุปสถานะจุด">
      <div class="card">ยังไม่ถึงรอบ<strong>0</strong></div><div class="card">ยังไม่ทำ<strong>1</strong></div>
      <div class="card">รอตรวจ<strong>0</strong></div><div class="card">ตรวจผ่าน<strong>0</strong></div>
      <div class="card">ต้องแก้ไข<strong>0</strong></div><div class="card">เลยเวลา<strong>0</strong></div>
      <div class="card">นอกเวลา<strong>0</strong></div>
    </div>
    <div class="region filters" aria-label="ตัวกรอง">
      <label>ตึก <select><option>ทุกตึก</option><option>ตึกทดลอง</option></select></label>
      <button class="button" type="button">มีปัญหาที่แจ้ง 0</button>
      <input type="search" placeholder="ค้นหาพื้นที่ จุด หรือชื่อแม่บ้าน" aria-label="ค้นหาพื้นที่ จุด หรือชื่อแม่บ้าน">
      <label><input type="checkbox" checked> เรียงพื้นที่ที่มีปัญหาขึ้นก่อน</label>
    </div>
    <section class="region">
      <h2>พื้นที่ที่ไม่มีปัญหา</h2>
      <div class="card-row"><div><strong>AR01 ชั้นหนึ่ง</strong><p class="sub">ตึก A · ตึกทดลอง · 1 จุด</p></div><span>ยังไม่ทำ 1</span></div>
    </section>
  </main>
</template>
<template id="menu">
  <nav aria-label="เมนูแอดมิน">
    <h2>ติดตามงาน</h2>
    <ul><li><a href="#" aria-current="page">สถานะจุด</a></li><li><a href="#">การเข้างาน</a></li><li><a href="#">ตารางงาน</a></li>
      <li><a href="#">รายการที่ขึ้นเตือน</a></li><li><a href="#">สรุปการตรวจ</a></li><li><a href="#">ส่งออก Excel</a></li></ul>
    <h2>ตั้งค่า</h2>
    <ul><li><a href="#">พื้นที่และป้าย</a></li><li><a href="#">ตึก</a></li><li><a href="#">พิมพ์ป้าย</a></li>
      <li><a href="#">บัญชีผู้ใช้</a></li><li><a href="#">ประวัติการแก้ไข</a></li></ul>
  </nav>
  <div class="account"><strong>ผู้ใช้ทดสอบ</strong><br><a href="#">ออกจากระบบ</a></div>
</template>
<template id="team">
  <main id="content" tabindex="-1">
    <div class="team-top">
      <a href="#">‹ ตึกของฉัน</a>
      <details><summary>ผู้ใช้ทดสอบ</summary><div><button type="button" class="button">ออกจากระบบ</button></div></details>
    </div>
    <header class="header">
      <div><h1>จัดตารางงาน</h1><p class="sub">ตารางรวมของตึกและกะที่คุณรับผิดชอบ</p></div>
      <button class="button" type="button">อัปเดต</button>
    </header>
    <div class="week">
      <button class="button" type="button" aria-label="สัปดาห์ก่อนหน้า">‹</button>
      <strong>16/11–22/11 2026</strong>
      <button class="button" type="button" aria-label="สัปดาห์ถัดไป">›</button>
    </div>
    <h2 id="roster">ตารางงานรายสัปดาห์</h2>
    <p id="scroll-help" class="scroll-help">เลื่อนตารางไปด้านข้างเพื่อดูวันอื่น ใช้ปุ่มลูกศรเมื่อโฟกัสอยู่ที่ตาราง</p>
    <div class="table-scroll" tabindex="0" role="region" aria-labelledby="roster" aria-describedby="scroll-help">
      <table aria-label="ตารางงานรายสัปดาห์"><thead><tr><th scope="col">แม่บ้าน</th></tr></thead>
        <tbody><tr><th scope="row">แม่บ้านทดสอบ<br><span class="sub">แม่บ้านประจำ</span></th></tr></tbody></table>
    </div>
  </main>
</template>
<script>
  const view = new URLSearchParams(location.search).get('view') === 'team' ? 'team' : 'admin';
  document.body.className = view;
  document.body.append(document.getElementById(view).content.cloneNode(true));
  if (view === 'admin') {
    for (const target of document.querySelectorAll('.mobile-links,.desktop-nav')) {
      target.append(document.getElementById('menu').content.cloneNode(true));
    }
  } else {
    const days = ['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'];
    days.forEach((day,index) => {
      const heading = document.createElement('th');
      heading.scope = 'col';
      heading.innerHTML = day + '<br>' + (16+index) + '/11';
      document.querySelector('thead tr').append(heading);
      const cell = document.querySelector('tbody tr').insertCell();
      cell.innerHTML = index === 6 ? 'วันหยุด' : '<strong>ทำงาน</strong><br>พื้นที่ 1<a href="#">เพิ่มเวลาที่ขาด</a><a href="#">ย้ายพื้นที่</a>';
    });
  }
</script>
</body>
</html>
