<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ตึก</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.is{width:16px;height:16px}
button,a,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid #2457C5;outline-offset:2px}
a{color:#2457C5}a:hover{color:#1D4AA8}
th{font-weight:600;text-align:left;padding:10px 16px;border-bottom:1px solid #E0E5EB;font-size:13px;color:#667085;background:#F9FAFB;white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid #E0E5EB;vertical-align:middle;height:56px}
</style>
</helmet>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></symbol>
<symbol id="i-bld" viewBox="0 0 24 24"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path><path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path><path d="M10 18h4"></path></symbol>
<symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></symbol>
<symbol id="i-hist" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></symbol>
<symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M12 5v14"></path></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path><path d="m15 5 4 4"></path></symbol>
<symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10"></path><path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"></path></symbol>
</svg>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F6F8; color: #202936; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Thai', sans-serif; font-size: 14px; line-height: 1.5">

  <nav aria-label="เมนูหลัก" style="flex: 1 1 240px; background: #FFFFFF; border-right: 1px solid #E0E5EB; padding: 20px 12px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; padding: 0 12px">
      <span style="font-size: 16px; font-weight: 700">ระบบตรวจงานแม่บ้าน</span>
      <span style="font-size: 13px; color: #667085">แอดมิน</span>
    </div>
    <sc-for list="{{nav}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 600; color: #667085; padding: 0 12px 4px">{{g.title}}</span>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="5">
          <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}"><svg class="i" aria-hidden="true"><use href="#{{it.icon}}"></use></svg><span style="flex: 1">{{it.label}}</span><sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{false}}"><span style="min-width: 22px; height: 22px; padding: 0 6px; border-radius: 4px; background: #B42318; color: #FFFFFF; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{it.badge}}</span></sc-if></a>
        </sc-for>
      </div>
    </sc-for>
    <div style="margin-top: auto; border-top: 1px solid #E0E5EB; padding: 16px 12px 0; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">ผู้ดูแลระบบ 01</span>
      <a href="AdminLogin.dc.html" style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; text-decoration: none; min-height: 36px"><svg class="i is" aria-hidden="true"><use href="#i-logout"></use></svg>ออกจากระบบ</a>
    </div>
  </nav>

  <div style="flex: 999 1 640px; min-width: 0; padding: 24px; display: flex; justify-content: center">
  <main style="width: 100%; max-width: 1216px; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3">ตึก</h1>
      <span style="font-size: 14px; color: #667085">ตึกที่ปิดใช้งาน จะไม่แสดงในหน้าสถานะจุด และสแกนป้ายในตึกนั้นไม่ได้</span>
    </header>

    <form aria-label="เพิ่มตึก" style="background: #FFFFFF; border: 1px solid #E0E5EB; border-radius: 8px; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 4px"><label for="b-code" style="font-weight: 600">รหัส</label><input id="b-code" placeholder="G" maxlength="3" style="width: 96px; height: 36px; padding: 0 12px; border: 1px solid #858F9E; border-radius: 6px; font-size: 14px; color: #202936"></div>
      <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px"><label for="b-name" style="font-weight: 600">ชื่อตึก</label><input id="b-name" placeholder="เช่น อาคารซ่อมบำรุง" style="height: 36px; padding: 0 12px; border: 1px solid #858F9E; border-radius: 6px; font-size: 14px; color: #202936"></div>
      <button type="submit" style="height: 36px; padding: 0 16px; border: 0; border-radius: 6px; background: #2457C5; color: #FFFFFF; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px"><svg class="i is" aria-hidden="true"><use href="#i-plus"></use></svg>เพิ่มตึก</button>
    </form>

    <div style="background: #FFFFFF; border: 1px solid #E0E5EB; border-radius: 8px; overflow-x: auto">
      <table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px">
        <thead><tr><th style="width: 80px">รหัส</th><th>ชื่อตึก</th><th style="text-align: right">พื้นที่</th><th>หัวหน้า</th><th style="text-align: center; width: 148px">สถานะ</th><th><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">การกระทำ</span></th></tr></thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <tr style="{{r.rowStyle}}">
              <td><b style="font-size: 16px">{{r.code}}</b></td>
              <td>
                <sc-if value="{{r.editing}}" hint-placeholder-val="{{false}}"><div style="display: flex; gap: 8px; align-items: center"><input aria-label="ชื่อตึก" value="{{r.name}}" style="flex: 1; min-width: 0; height: 36px; padding: 0 12px; border: 2px solid #2457C5; border-radius: 6px; font-size: 14px; color: #202936"><button type="button" onClick="{{r.stop}}" style="height: 36px; padding: 0 12px; border: 0; border-radius: 6px; background: #2457C5; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">บันทึก</button><button type="button" onClick="{{r.stop}}" style="height: 36px; padding: 0 12px; border: 1px solid #858F9E; border-radius: 6px; background: #FFFFFF; color: #202936; font-size: 14px; font-weight: 600; cursor: pointer">ยกเลิก</button></div></sc-if>
                <sc-if value="{{r.view}}" hint-placeholder-val="{{true}}"><span style="{{r.nameStyle}}">{{r.name}}</span></sc-if>
              </td>
              <td style="text-align: right; font-variant-numeric: tabular-nums">{{r.areas}}</td>
              <td>{{r.sup}}</td>
              <td style="text-align: center"><span style="{{r.chip}}"><svg class="i is" aria-hidden="true"><use href="#{{r.icon}}"></use></svg>{{r.state}}</span></td>
              <td style="white-space: nowrap; width: 1%"><div style="display: grid; grid-template-columns: 88px 104px; align-items: center; gap: 4px">
                <sc-if value="{{r.editing}}" hint-placeholder-val="{{false}}"><span aria-hidden="true"></span></sc-if>
                <sc-if value="{{r.view}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{r.edit}}" style="height: 32px; padding: 0 8px; border: 0; background: transparent; color: #2457C5; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; cursor: pointer"><svg class="i is" aria-hidden="true"><use href="#i-pencil"></use></svg>แก้ชื่อ</button></sc-if>
                <button type="button" style="{{r.toggleStyle}}"><svg class="i is" aria-hidden="true"><use href="#i-power"></use></svg>{{r.toggle}}</button>
              </div></td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":780}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { editing: 'B' }; }
renderVals() {
const ACTIVE = 'bld';
const NAV = [['ติดตามงาน', [['dash', 'สถานะจุด', 'i-grid', 'Dashboard.dc.html'], ['att', 'การเข้างาน', 'i-users', 'Attendance.dc.html'], ['alert', 'รายการที่ขึ้นเตือน', 'i-alert', 'Alerts.dc.html', '7'], ['sum', 'สรุปการตรวจ', 'i-clip', 'InspectSummary.dc.html'], ['exp', 'ส่งออก Excel', 'i-dl', 'Export.dc.html']]], ['ตั้งค่า', [['area', 'พื้นที่และป้าย', 'i-pin', 'Areas.dc.html'], ['bld', 'ตึก', 'i-bld', 'Buildings.dc.html'], ['print', 'พิมพ์ป้าย', 'i-print', 'PrintSigns.dc.html'], ['acc', 'บัญชีผู้ใช้', 'i-user', 'Accounts.dc.html'], ['log', 'ประวัติการแก้ไข', 'i-hist', 'AuditLog.dc.html']]]];
const navBase = 'display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; text-decoration: none; font-size: 14px; ';
const nav = NAV.map((g) => ({ title: g[0], items: g[1].map((x) => ({ label: x[1], icon: x[2], href: x[3], badge: x[4] || '', hasBadge: !!x[4], current: x[0] === ACTIVE ? 'page' : undefined, style: navBase + (x[0] === ACTIVE ? 'background: #EEF3FC; color: #2457C5; font-weight: 600' : 'color: #344054; font-weight: 500') })) }));
const on = 'display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; width: 124px; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 14px; font-weight: 600; background: #EDF7F0; color: #16803C; border: 1px solid #B9DFC6';
const off = 'display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; width: 124px; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 14px; font-weight: 600; background: #F2F4F7; color: #5B6474; border: 1px solid #E0E5EB';
const D = [['A', 'อาคารผลิต 1', 14, 'ประภา มั่นคง · สมพร ดีเลิศ', true], ['B', 'อาคารผลิต 2', 13, 'ธนา พงษ์ไพร', true], ['C', 'โรงอาหาร', 10, 'ศิริพร ใจงาม', true], ['D', 'สำนักงาน', 12, 'อรุณี แก้วใส', true], ['E', 'ล็อบบี้', 11, 'ชัยวัฒน์ ศรีงาม', true], ['F', 'คลังสินค้า', 11, 'ยังไม่มีหัวหน้า', true], ['G', 'อาคารเก่า', 0, '–', false]];
const rows = D.map((d) => {
  const ed = this.state.editing === d[0];
  return { code: d[0], name: d[1], areas: d[2], sup: d[3], state: d[4] ? 'เปิดใช้' : 'ปิดใช้', chip: d[4] ? on : off, icon: d[4] ? 'i-check' : 'i-minus',
    editing: ed, view: !ed, edit: () => this.setState({ editing: d[0] }), stop: () => this.setState({ editing: null }),
    rowStyle: d[4] ? '' : 'background: #F9FAFB', nameStyle: d[4] ? 'font-weight: 600' : 'font-weight: 600; color: #667085',
    toggle: d[4] ? 'ปิดใช้' : 'เปิดใช้',
    toggleStyle: 'width: 104px; height: 32px; padding: 0 10px; border-radius: 6px; background: #FFFFFF; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 4px; ' + (d[4] ? 'border: 1px solid #B42318; color: #B42318' : 'border: 1px solid #858F9E; color: #202936') };
});
return { nav: nav, rows: rows };
}
}
</script>
</body>
</html>
