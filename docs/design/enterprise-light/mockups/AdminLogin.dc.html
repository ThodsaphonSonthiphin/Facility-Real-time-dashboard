<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แอดมินเข้าสู่ระบบ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.is{width:16px;height:16px}
button,a,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid #2457C5;outline-offset:2px}
a{color:#2457C5}a:hover{color:#1D4AA8}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<symbol id="i-x-c" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></symbol>
</svg>
<div style="min-height: 100vh; background: #F4F6F8; color: #202936; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Thai', sans-serif; font-size: 14px; line-height: 1.5; display: flex; align-items: center; justify-content: center; padding: 48px 16px">
  <main style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 14px; font-weight: 600; color: #667085">ระบบตรวจงานแม่บ้าน</span>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3">แอดมินเข้าสู่ระบบ</h1>
    </div>
    <form style="background: #FFFFFF; border: 1px solid #E0E5EB; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
      <sc-if value="{{wrong}}" hint-placeholder-val="{{false}}">
        <div role="alert" style="display: flex; gap: 12px; padding: 12px 16px; border-radius: 6px; background: #FEF3F2; border: 1px solid #F6C9C4"><svg class="i" aria-hidden="true" style="color: #B42318"><use href="#i-x-c"></use></svg><span><b>ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</b><br>ตรวจตัวพิมพ์เล็กใหญ่ แล้วลองอีกครั้ง (เหลืออีก 2 ครั้ง)</span></div>
      </sc-if>
      <sc-if value="{{locked}}" hint-placeholder-val="{{false}}">
        <div role="alert" style="display: flex; gap: 12px; padding: 12px 16px; border-radius: 6px; background: #FEF6EC; border: 1px solid #F5D6B0"><svg class="i" aria-hidden="true" style="color: #B45309"><use href="#i-lock"></use></svg><span><b>บัญชีถูกล็อกชั่วคราว</b><br>ใส่รหัสผิด 5 ครั้ง ลองใหม่ได้ในอีก 15 นาที หรือให้แอดมินคนอื่นรีเซ็ตให้</span></div>
      </sc-if>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="u" style="font-weight: 600">ชื่อผู้ใช้</label>
        <input id="u" autocomplete="username" value="{{user}}" disabled="{{busy}}" style="height: 40px; padding: 0 12px; border: 1px solid #858F9E; border-radius: 6px; font-size: 14px; color: #202936; background: #FFFFFF">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="p" style="font-weight: 600">รหัสผ่าน</label>
        <div style="display: flex; gap: 8px">
          <input id="p" type="password" autocomplete="current-password" value="{{pass}}" disabled="{{busy}}" aria-invalid="{{wrongAttr}}" style="{{passStyle}}">
          <button type="button" style="height: 40px; padding: 0 12px; border: 1px solid #858F9E; border-radius: 6px; background: #FFFFFF; color: #202936; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; flex: none"><svg class="i is" aria-hidden="true"><use href="#i-eye"></use></svg>แสดง</button>
        </div>
      </div>
      <button type="submit" disabled="{{busy}}" style="height: 40px; border: 0; border-radius: 6px; background: #2457C5; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
        <sc-if value="{{busy}}" hint-placeholder-val="{{false}}"><span style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); border-top-color: #FFFFFF; animation: spin 0.9s linear infinite"></span></sc-if>{{btn}}
      </button>
    </form>
    <span style="font-size: 13px; color: #667085; text-align: center">ลืมรหัสผ่าน ให้แอดมินคนอื่นรีเซ็ตให้ที่หน้า บัญชีผู้ใช้</span>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["ปกติ","รหัสผิด","กำลังเข้า","ล็อกชั่วคราว"],"default":"ปกติ"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const s = this.props.state ?? 'ปกติ';
const wrong = s === 'รหัสผิด';
const filled = s !== 'ปกติ';
return { wrong: wrong, locked: s === 'ล็อกชั่วคราว', busy: s === 'กำลังเข้า', wrongAttr: wrong ? 'true' : 'false',
  user: filled ? 'admin01' : '', pass: filled ? 'xxxxxxxxxx' : '',
  btn: s === 'กำลังเข้า' ? 'กำลังเข้าสู่ระบบ…' : 'เข้าสู่ระบบ',
  passStyle: 'flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 6px; font-size: 14px; color: #202936; background: #FFFFFF; border: ' + (wrong ? '2px solid #B42318' : '1px solid #858F9E') };
}
}
</script>
</body>
</html>
