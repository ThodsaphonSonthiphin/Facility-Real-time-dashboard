<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ผลการส่ง ทุกกรณี</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1720px; height: 1940px; box-sizing: border-box; padding: 32px; background: #E4E8ED; color: #202936; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Thai', sans-serif; line-height: 1.5; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; flex-direction: column">
    <span style="font-size: 22px; font-weight: 700">5 ผลการส่ง · ทุกกรณี</span>
    <span style="font-size: 15px; color: #475467">หัวข้อ 30 px ไอคอน 56 px อ่านได้จากระยะแขน · เขียว = บันทึกแล้ว · ส้ม = บันทึกแต่มีเงื่อนไข · แดง = ไม่ได้บันทึก</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, 390px); gap: 32px">
    <sc-for list="{{items}}" as="s" hint-placeholder-count="8">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 15px; font-weight: 600">{{s.kind}}</span>
        <div style="width: 390px; height: 844px; overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px #C9D0D9; background: #FFFFFF">
          <dc-import name="Result" kind="{{s.kind}}" hint-size="390px,844px"></dc-import>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1720,"height":1940}}'>
class Component extends DCLogic {
renderVals() {
return { items: ['ส่งสำเร็จ', 'ส่งช้า', 'ส่งเพิ่ม', 'ไกลป้าย', 'ส่งไม่สำเร็จ', 'สแกนผิดพื้นที่', 'ยังไม่ได้ลงเวลา', 'ปิด Location'].map((x) => ({ kind: x })) };
}
}
</script>
</body>
</html>
