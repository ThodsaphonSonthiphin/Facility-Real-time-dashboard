<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ตรวจงาน สถานะอื่น</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1720px; height: 1030px; box-sizing: border-box; padding: 32px; background: #E4E8ED; color: #202936; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Thai', sans-serif; line-height: 1.5; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; flex-direction: column">
    <span style="font-size: 22px; font-weight: 700">7 ตรวจงาน · สถานะอื่น</span>
    <span style="font-size: 15px; color: #475467">หัวหน้าสแกนป้ายของจุด แล้วเจอกรณีเหล่านี้</span>
  </div>
  <div style="display: flex; gap: 32px">
    <sc-for list="{{items}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 15px; font-weight: 600">{{s.state}}</span>
        <div style="width: 390px; height: 844px; overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px #C9D0D9; background: #FFFFFF">
          <dc-import name="Inspect" state="{{s.state}}" hint-size="390px,844px"></dc-import>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1720,"height":1030}}'>
class Component extends DCLogic {
renderVals() {
return { items: ['ยังไม่มีงานให้ตรวจ', 'ตรวจเสร็จ', 'ผิดตึก', 'นอกกะ'].map((x) => ({ state: x })) };
}
}
</script>
</body>
</html>
