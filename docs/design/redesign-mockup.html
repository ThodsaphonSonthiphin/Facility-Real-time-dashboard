<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Janitorial Management Dashboard — Complete UX/UI Redesign Mockup (10 Usability Heuristics)</title>
<style>
/* ==========================================================================
   1. DESIGN TOKENS — Enterprise Light (Aligned with frontend/src/index.css)
   ========================================================================== */
:root {
  --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Thai', sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Neutral Surfaces */
  --bg: #F4F6F8;
  --canvas: #E6ECF4;
  --surface: #FFFFFF;
  --surface-2: #F9FAFB;
  --surface-hover: #F1F5F9;
  --skeleton: #E9EDF1;

  /* Typography & Borders (WCAG AA >= 4.5:1 text, >= 3:1 control borders) */
  --text: #202936;
  --text-2: #5A6577;
  --text-3: #344054;
  --border: #E0E5EB;
  --border-control: #858F9E;
  --backdrop: rgba(16, 24, 40, 0.48);

  /* Accent: Blue strictly means clickable / active selection */
  --accent: #2457C5;
  --accent-hover: #1D4AA8;
  --accent-subtle: #EEF3FC;
  --accent-border: #C2D5F8;
  --on-accent: #FFFFFF;

  /* Semantic Statuses (Always paired with Lucide icon + Thai text) */
  --rework: #B42318;
  --rework-bg: #FEF3F2;
  --rework-border: #F6C9C4;
  --rework-strong: #912018;

  --overdue: #B45309;
  --overdue-bg: #FEF6EC;
  --overdue-border: #F5D6B0;
  --overdue-strong: #8A3F06;

  --pending: #0B6E8A;
  --pending-bg: #EBF6FA;
  --pending-border: #B4DCE8;

  --passed: #16803C;
  --passed-bg: #EDF7F0;
  --passed-border: #B9DFC6;
  --passed-strong: #0F5C2B;

  --idle: #5B6474;
  --idle-bg: #F2F4F7;
  --idle-border: #E0E5EB;

  --break: #6941C6;
  --break-bg: #F4F1FB;
  --break-border: #D9CFF2;

  /* Radii & Elevation */
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-full: 9999px;

  --shadow-xs: 0 1px 2px rgba(16, 24, 40, 0.05);
  --shadow-sm: 0 2px 6px rgba(16, 24, 40, 0.07);
  --shadow-overlay: 0 16px 40px rgba(16, 24, 40, 0.2);
  --shadow-phone: 0 24px 60px rgba(15, 23, 42, 0.24), 0 0 0 10px #111827, 0 0 0 12px #334155;

  /* Motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: var(--font-sans);
  background: var(--canvas);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tabular { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

.icon {
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
  width: 16px;
  height: 16px;
}
.icon-sm { width: 14px; height: 14px; }
.icon-md { width: 20px; height: 20px; }
.icon-lg { width: 24px; height: 24px; }
.icon-xl { width: 28px; height: 28px; }

@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 0.9s linear infinite; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideRight { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.85); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ==========================================================================
   2. PROTOTYPE STUDIO SHELL (Top Control Bar + Screen Directory)
   ========================================================================== */
.studio-header {
  position: sticky; top: 0; z-index: 200;
  background: #0F172A;
  color: #F8FAFC;
  border-bottom: 1px solid #1E293B;
  padding: 10px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.studio-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.studio-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: var(--accent);
  color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.studio-title {
  font-size: 14px; font-weight: 700; color: #fff; line-height: 1.25;
}
.studio-sub {
  font-size: 12px; color: #94A3B8; line-height: 1.2;
}
.studio-center {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.role-pills {
  display: inline-flex;
  background: #1E293B;
  padding: 3px;
  border-radius: 9px;
  gap: 2px;
}
.role-pill {
  border: 0; background: transparent; color: #CBD5E1;
  padding: 6px 12px; border-radius: 7px;
  font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 34px;
  transition: background 150ms, color 150ms;
}
.role-pill:hover { background: rgba(255,255,255,0.08); color: #fff; }
.role-pill.active { background: var(--accent); color: #fff; }

.studio-right {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.studio-btn {
  border: 1px solid #334155;
  background: #1E293B;
  color: #E2E8F0;
  padding: 6px 11px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 150ms, border-color 150ms;
}
.studio-btn:hover { background: #273449; border-color: #475569; color: #fff; }
.studio-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.studio-btn-ghost {
  border: 1px solid #334155; background: transparent; color: #CBD5E1;
}
.studio-btn-ghost:hover { background: #1E293B; color: #fff; }

.viewport-toggle {
  display: inline-flex;
  background: #1E293B;
  padding: 3px;
  border-radius: 9px;
  border: 1px solid #334155;
}
.viewport-toggle button {
  border: 0; background: transparent; color: #94A3B8;
  padding: 5px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 30px;
}
.viewport-toggle button.active { background: #F8FAFC; color: #0F172A; }

/* Sub-bar: Quick Screen Switcher for Current Role */
.screen-strip {
  background: #FFFFFF;
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.screen-strip-label {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-2);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding-right: 6px;
  border-right: 1px solid var(--border);
}
.screen-chip {
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-3);
  padding: 6px 12px;
  border-radius: var(--r-full);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  min-height: 34px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 140ms;
}
.screen-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-subtle); }
.screen-chip.active {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--on-accent);
}
.screen-chip .route-tag {
  font-family: var(--font-mono);
  font-size: 11px;
  opacity: 0.78;
}

/* Main Stage */
.studio-stage {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px 16px 48px;
  min-height: calc(100vh - 112px);
  gap: 20px;
}

/* Phone Frame vs Desktop Frame */
.device-frame {
  width: 100%;
  transition: max-width 220ms var(--ease-out);
  position: relative;
}
.device-frame.mode-mobile {
  max-width: 393px;
  border-radius: 36px;
  background: var(--bg);
  box-shadow: var(--shadow-phone);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 812px;
  max-height: calc(100vh - 140px);
}
.device-frame.mode-desktop {
  max-width: 1400px;
  border-radius: var(--r-lg);
  background: var(--bg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  min-height: 760px;
  display: flex;
  flex-direction: column;
}

/* Mobile Status Bar Mock (iOS/Android style clean bar) */
.phone-os-bar {
  display: none;
  background: var(--surface);
  padding: 8px 20px 4px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.mode-mobile .phone-os-bar { display: flex; }

/* Frame Viewport Container (scrolls internally on mobile frame so sticky bars stay real!) */
.app-viewport {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}
.mode-desktop .app-viewport {
  overflow: visible;
}

/* ==========================================================================
   3. REDESIGNED DESIGN SYSTEM COMPONENTS
   ========================================================================== */

/* Buttons — Strict Hierarchy & Consistent Placement */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: var(--r-md);
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
  border: 1px solid transparent;
  transition: background 140ms, border-color 140ms, color 140ms, transform 100ms;
  user-select: none;
}
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.48; cursor: not-allowed; }

/* Sizes */
.btn-desk { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn-sm { min-height: 36px; padding: 0 11px; font-size: 13px; }
.btn-phone { min-height: 48px; padding: 0 16px; font-size: 16px; }
.btn-main { min-height: 54px; padding: 0 20px; font-size: 17px; font-weight: 700; width: 100%; border-radius: 10px; }

/* Variants */
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-control); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-2); border-color: var(--accent); color: var(--accent); }

.btn-subtle { background: var(--accent-subtle); color: var(--accent); border-color: var(--accent-border); }
.btn-subtle:hover:not(:disabled) { background: #E1ECFB; }

.btn-ghost { background: transparent; color: var(--text-3); border-color: transparent; }
.btn-ghost:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }

.btn-danger { background: var(--surface); color: var(--rework); border-color: var(--rework-border); }
.btn-danger:hover:not(:disabled) { background: var(--rework-bg); border-color: var(--rework); }

.btn-danger-solid { background: var(--rework); color: var(--on-accent); border-color: var(--rework); }
.btn-danger-solid:hover:not(:disabled) { background: var(--rework-strong); border-color: var(--rework-strong); }

.btn-add {
  background: var(--surface); color: var(--accent);
  border: 1.5px dashed var(--accent);
}
.btn-add:hover:not(:disabled) { background: var(--accent-subtle); }

.btn-link {
  background: transparent; border: 0; color: var(--accent);
  padding: 4px 2px; min-height: 36px; font-weight: 600;
}
.btn-link:hover:not(:disabled) { text-decoration: underline; }

.btn-full { width: 100%; }

/* Cards & Panels */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px;
}
.card-compact { padding: 12px 14px; }
.card-flush { padding: 0; overflow: hidden; }
.card-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.card-title { font-size: 16px; font-weight: 700; color: var(--text); }
.card-sub { font-size: 13px; color: var(--text-2); }

/* Semantic Status Chips (Icon + Thai words ALWAYS) */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: var(--r-full);
  border: 1px solid transparent;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.35;
  white-space: nowrap;
}
.chip-lg { padding: 5px 12px; font-size: 14px; }
.chip-rework { background: var(--rework-bg); color: var(--rework); border-color: var(--rework-border); }
.chip-rework-solid { background: var(--rework); color: #fff; border-color: var(--rework); }
.chip-overdue { background: var(--overdue-bg); color: var(--overdue); border-color: var(--overdue-border); }
.chip-overdue-solid { background: var(--overdue); color: #fff; border-color: var(--overdue); }
.chip-pending { background: var(--pending-bg); color: var(--pending); border-color: var(--pending-border); }
.chip-passed { background: var(--passed-bg); color: var(--passed); border-color: var(--passed-border); }
.chip-passed-solid { background: var(--passed); color: #fff; border-color: var(--passed); }
.chip-idle { background: var(--idle-bg); color: var(--idle); border-color: var(--idle-border); }
.chip-break { background: var(--break-bg); color: var(--break); border-color: var(--break-border); }
.chip-accent { background: var(--accent-subtle); color: var(--accent); border-color: var(--accent-border); }

/* Notes / Alert Banners */
.note {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
  font-size: 14px;
  line-height: 1.5;
}
.mode-mobile .note { font-size: 15px; }
.note-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.note-title { font-weight: 700; }
.note-info { background: var(--pending-bg); border-color: var(--pending-border); color: #094D61; }
.note-success { background: var(--passed-bg); border-color: var(--passed-border); color: var(--passed-strong); }
.note-warn { background: var(--overdue-bg); border-color: var(--overdue-border); color: var(--overdue-strong); }
.note-error { background: var(--rework-bg); border-color: var(--rework-border); color: var(--rework-strong); }
.note-break { background: var(--break-bg); border-color: var(--break-border); color: #4C2A9B; }

/* Live Status Pill (Heuristic 1) */
.live-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: var(--r-full);
  font-size: 12.5px;
  font-weight: 600;
  border: 1px solid var(--passed-border);
  background: var(--passed-bg);
  color: var(--passed-strong);
  white-space: nowrap;
}
.live-pill .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--passed);
  animation: pulseDot 2s infinite;
}
.live-pill.reconnecting {
  border-color: var(--overdue-border);
  background: var(--overdue-bg);
  color: var(--overdue-strong);
}
.live-pill.reconnecting .dot { background: var(--overdue); }

/* Form Fields (Always Visible Labels + Helper + Inline Error) */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field-label { font-size: 14px; font-weight: 700; color: var(--text); }
.mode-mobile .field-label { font-size: 15px; }
.field-req { color: var(--rework); margin-left: 2px; }
.field-help { font-size: 13px; color: var(--text-2); }
.field-error {
  font-size: 13px; font-weight: 600; color: var(--rework);
  display: flex; align-items: center; gap: 5px;
}
.input, .select, .textarea {
  width: 100%;
  min-height: 40px;
  padding: 8px 12px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-control);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  transition: border-color 140ms, box-shadow 140ms;
}
.mode-mobile .input, .mode-mobile .select, .mode-mobile .textarea {
  min-height: 48px;
  font-size: 16px;
  padding: 10px 14px;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(36, 87, 197, 0.16);
}
.input.is-error { border-color: var(--rework); background: #FFFBFB; }
.textarea { min-height: 84px; resize: vertical; }

/* Quick Pick Chips (Heuristic 6: Recognition over Recall) */
.quick-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.quick-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 12px;
  border-radius: var(--r-full);
  border: 1px solid var(--border-control);
  background: var(--surface);
  color: var(--text-3);
  font-size: 13.5px;
  font-weight: 600;
  transition: all 130ms;
}
.mode-mobile .quick-chip { min-height: 44px; padding: 8px 14px; font-size: 15px; }
.quick-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-subtle); }
.quick-chip.selected {
  border-color: var(--accent);
  background: var(--accent-subtle);
  color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

/* Segmented Control */
.segmented {
  display: inline-flex;
  background: var(--idle-bg);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 3px;
  gap: 3px;
  max-width: 100%;
  overflow-x: auto;
}
.segmented button {
  border: 0; background: transparent; color: var(--text-3);
  padding: 6px 12px; border-radius: 6px;
  font-size: 13.5px; font-weight: 600;
  min-height: 34px; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all 140ms;
}
.segmented button.active {
  background: var(--surface);
  color: var(--accent);
  box-shadow: var(--shadow-xs);
}

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.tab-btn {
  border: 0; background: transparent;
  padding: 10px 14px;
  min-height: 44px;
  font-size: 14px; font-weight: 600;
  color: var(--text-2);
  border-bottom: 2.5px solid transparent;
  display: inline-flex; align-items: center; gap: 7px;
  white-space: nowrap;
  margin-bottom: -1px;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.tab-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px; padding: 0 6px;
  border-radius: var(--r-full);
  font-size: 12px; font-weight: 700;
  background: var(--idle-bg); color: var(--idle);
}
.tab-btn.active .tab-count { background: var(--accent-subtle); color: var(--accent); }
.tab-count.danger { background: var(--rework); color: #fff; }

/* Choice Tiles (Large Thumb Targets for Phone) */
.choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.choice-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 108px;
  padding: 16px 12px;
  border-radius: var(--r-lg);
  border: 1.5px solid var(--border-control);
  background: var(--surface);
  color: var(--text);
  font-size: 17px;
  font-weight: 700;
  text-align: center;
  transition: all 140ms;
}
.choice-tile:hover { border-color: var(--accent); background: var(--surface-2); }
.choice-tile.selected {
  border: 2px solid var(--accent);
  background: var(--accent-subtle);
  color: var(--accent);
}
.choice-tile-sub { font-size: 13px; font-weight: 500; color: var(--text-2); }
.choice-tile.selected .choice-tile-sub { color: var(--accent); }

/* KPI Grid & Cards */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.kpi-grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.kpi-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mode-mobile .kpi-grid,
.mode-mobile .kpi-grid-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  text-align: left;
  transition: border-color 140ms, background 140ms;
}
button.kpi-card:hover { border-color: var(--accent); }
button.kpi-card.active {
  border-color: var(--accent);
  background: var(--accent-subtle);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.kpi-top {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--text-2);
}
.kpi-val {
  font-size: 26px; font-weight: 800; line-height: 1.15; color: var(--text);
  font-variant-numeric: tabular-nums;
}
.mode-mobile .kpi-val { font-size: 22px; }
.kpi-unit { font-size: 13px; font-weight: 600; color: var(--text-2); margin-left: 3px; }
.kpi-tone-rework .kpi-top { color: var(--rework); }
.kpi-tone-overdue .kpi-top { color: var(--overdue); }
.kpi-tone-pending .kpi-top { color: var(--pending); }
.kpi-tone-passed .kpi-top { color: var(--passed); }
.kpi-tone-break .kpi-top { color: var(--break); }
.kpi-tone-accent .kpi-top { color: var(--accent); }

/* Progress Bar */
.progress-track {
  width: 100%; height: 10px;
  background: var(--idle-bg);
  border-radius: var(--r-full);
  overflow: hidden;
  display: flex;
}
.progress-fill-passed { background: var(--passed); height: 100%; transition: width 260ms var(--ease-out); }
.progress-fill-pending { background: var(--pending); height: 100%; transition: width 260ms var(--ease-out); }
.progress-fill-accent { background: var(--accent); height: 100%; transition: width 260ms var(--ease-out); }

/* Tables (Desktop) & Card Lists (Mobile) */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  border-radius: var(--r-lg);
}
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.table th {
  text-align: left;
  padding: 11px 14px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-2);
  white-space: nowrap;
}
.table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: #FAFCFF; }
.table tr.row-warn td { background: #FFFBF5; }
.table tr.row-danger td { background: #FFF8F7; }

.avatar {
  width: 34px; height: 34px; border-radius: var(--r-full);
  background: var(--accent-subtle); color: var(--accent);
  border: 1px solid var(--accent-border);
  font-size: 13px; font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.avatar-break { background: var(--break-bg); color: var(--break); border-color: var(--break-border); }

/* Details / Accordion (Heuristic 8: Progressive Disclosure) */
.disclosure {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
}
.disclosure summary {
  padding: 11px 14px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-3);
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
}
.disclosure summary::-webkit-details-marker { display: none; }
.disclosure-body {
  padding: 0 14px 14px;
  font-size: 13.5px;
  color: var(--text-2);
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}

/* ==========================================================================
   4. MOBILE APP SHELL (Consistent Top Bar + Scrollable Body + Bottom Nav/Dock)
   ========================================================================== */
.phone-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  background: var(--bg);
  font-size: 16px;
}
.mode-desktop .phone-shell {
  max-width: 480px;
  width: 100%;
  margin: 20px auto;
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  overflow: hidden;
  min-height: 720px;
  box-shadow: var(--shadow-sm);
}

/* Top App Bar: ALWAYS Left=Back or Identity, Right=Help + Account */
.phone-topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-shrink: 0;
  z-index: 20;
}
.phone-topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 1;
}
.phone-topbar-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.phone-topbar-sub {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.phone-topbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.topbar-pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 40px;
  padding: 0 10px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-3);
  font-size: 13.5px;
  font-weight: 600;
}
.topbar-pill-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-subtle); }

/* Scrollable Main Area inside Phone Shell */
.phone-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overscroll-behavior: contain;
}

/* Sticky Primary Action Dock (Task Screens) */
.phone-dock {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
  z-index: 20;
}
.phone-dock-row {
  display: grid;
  grid-template-columns: 1fr 1.6fr;
  gap: 10px;
}

/* Fixed 3-Tab Bottom Navigation (Hub Screens — ZERO duplicate links in page!) */
.phone-bottom-nav {
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  padding: 6px 8px 10px;
  gap: 4px;
  flex-shrink: 0;
  z-index: 20;
}
.bnav-item {
  border: 0;
  background: transparent;
  color: var(--text-2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 52px;
  border-radius: var(--r-md);
  font-size: 13px;
  font-weight: 600;
  position: relative;
  transition: background 140ms, color 140ms;
}
.bnav-item:hover { background: var(--surface-2); color: var(--text); }
.bnav-item.active {
  background: var(--accent-subtle);
  color: var(--accent);
  font-weight: 700;
}
.bnav-badge {
  position: absolute;
  top: 4px; right: 18%;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: var(--r-full);
  background: var(--rework); color: #fff;
  font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}

/* ==========================================================================
   5. ADMIN SHELL (Desktop Sidebar + Clean Mobile Drawer & Sticky Bar)
   ========================================================================== */
.admin-shell {
  display: flex;
  flex: 1;
  min-height: 0;
  height: 100%;
  background: var(--bg);
}
.mode-mobile .admin-shell {
  flex-direction: column;
}

/* Desktop Sidebar */
.admin-sidebar {
  width: 248px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
  gap: 16px;
}
.mode-mobile .admin-sidebar { display: none; }

.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 2px 8px 14px;
  border-bottom: 1px solid var(--border);
}
.brand-badge {
  width: 34px; height: 34px; border-radius: 8px;
  background: var(--accent); color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-name { font-size: 14px; font-weight: 800; color: var(--text); line-height: 1.2; }
.brand-role { font-size: 12.5px; color: var(--text-2); }

.nav-group-title {
  font-size: 12px; font-weight: 700; color: var(--text-2);
  padding: 4px 10px 6px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.nav-list { display: flex; flex-direction: column; gap: 2px; }
.nav-link {
  width: 100%;
  border: 0; background: transparent;
  display: flex; align-items: center; gap: 10px;
  min-height: 40px; padding: 0 10px;
  border-radius: var(--r-md);
  font-size: 14px; font-weight: 600; color: var(--text-3);
  text-align: left;
  transition: background 140ms, color 140ms;
}
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link.active { background: var(--accent-subtle); color: var(--accent); font-weight: 700; }
.nav-link .nav-spacer { flex: 1; }
.nav-alert-slot {
  width: 40px; display: inline-flex; justify-content: flex-end; flex-shrink: 0;
}
.nav-alert-pill {
  background: var(--rework); color: #fff;
  min-width: 22px; height: 22px; padding: 0 6px;
  border-radius: var(--r-sm); font-size: 12px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}

.sidebar-footer {
  margin-top: auto;
  border-top: 1px solid var(--border);
  padding-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* Mobile Admin Sticky Topbar (Replaces messy wrapped menu!) */
.admin-mobile-bar {
  display: none;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 12px;
  min-height: 56px;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-shrink: 0;
  z-index: 25;
}
.mode-mobile .admin-mobile-bar { display: flex; }

.admin-main-wrap {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.mode-mobile .admin-main-wrap { overflow-y: auto; }

/* Desktop Top Utility Bar (Quick Search ⌘K + Live Status + Help) */
.admin-utility-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.mode-mobile .admin-utility-bar { display: none; }

.cmd-trigger {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 36px; padding: 0 12px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 13.5px;
  min-width: 260px;
  justify-content: space-between;
}
.cmd-trigger:hover { border-color: var(--accent); color: var(--text); }
.kbd {
  font-family: var(--font-mono);
  font-size: 11.5px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-2);
}

.admin-content {
  padding: 22px 24px 36px;
  max-width: 1160px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.mode-mobile .admin-content {
  padding: 14px 14px 28px;
  gap: 14px;
}

.page-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
}
.page-title { font-size: 22px; font-weight: 800; line-height: 1.25; color: var(--text); display: flex; align-items: center; gap: 8px; }
.mode-mobile .page-title { font-size: 20px; }
.page-desc { font-size: 14px; color: var(--text-2); margin-top: 2px; }
.page-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.mode-mobile .page-actions { width: 100%; }
.mode-mobile .page-actions .btn { flex: 1; }

/* Filter Bar */
.filter-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 12px;
}
.mode-mobile .filter-bar {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  padding: 12px;
}
.filter-bar .field { min-width: 150px; }
.filter-bar .field-grow { flex: 1; min-width: 200px; }
.mode-mobile .filter-bar .field,
.mode-mobile .filter-bar .field-grow { min-width: 0; width: 100%; }

/* ==========================================================================
   6. SPECIFIC PATTERNS (Hero Job, Timeline, Roster, Print Sheet, Charts)
   ========================================================================== */
.hero-job {
  background: var(--surface);
  border: 2px solid var(--rework);
  border-radius: var(--r-lg);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.hero-job.tone-overdue { border-color: var(--overdue); }
.hero-job.tone-accent { border-color: var(--accent); }
.hero-eyebrow {
  font-size: 13px; font-weight: 800; color: var(--rework);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.hero-job.tone-overdue .hero-eyebrow { color: var(--overdue); }
.hero-point-name { font-size: 20px; font-weight: 800; line-height: 1.3; }
.defect-box {
  background: var(--rework-bg);
  border: 1px solid var(--rework-border);
  border-radius: var(--r-md);
  padding: 10px 12px;
  font-size: 14.5px;
  color: var(--rework-strong);
}

/* Work / Point Row Cards */
.list-stack { display: flex; flex-direction: column; gap: 8px; }
.point-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.point-row-top {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
}
.point-row-name { font-size: 16px; font-weight: 700; color: var(--text); }
.point-row-meta { font-size: 13.5px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* 6-Step Attendance Timeline */
.timeline { display: flex; flex-direction: column; gap: 8px; }
.tl-step {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
}
.tl-step.done { border-color: var(--passed-border); background: #FAFDFB; }
.tl-step.next { border: 2px solid var(--accent); background: var(--accent-subtle); }
.tl-step.missed { border-color: var(--overdue-border); background: var(--overdue-bg); }
.tl-num {
  width: 30px; height: 30px; border-radius: var(--r-full);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13.5px; font-weight: 800; flex-shrink: 0;
  background: var(--idle-bg); color: var(--idle);
}
.tl-step.done .tl-num { background: var(--passed); color: #fff; }
.tl-step.next .tl-num { background: var(--accent); color: #fff; }
.tl-step.missed .tl-num { background: var(--overdue); color: #fff; }
.tl-info { flex: 1; min-width: 0; }
.tl-label { font-weight: 700; font-size: 15.5px; }
.tl-sub { font-size: 13px; color: var(--text-2); }
.tl-time { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }

/* Weekly Roster Matrix */
.roster-scroll {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
}
.roster-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 820px; }
.roster-table th, .roster-table td {
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 8px;
  vertical-align: top;
}
.roster-table th {
  background: var(--surface-2);
  font-size: 13px; font-weight: 700; color: var(--text-2);
  text-align: center;
}
.roster-table th.col-sticky,
.roster-table td.col-sticky {
  position: sticky; left: 0; z-index: 4;
  background: var(--surface);
  min-width: 185px; max-width: 185px;
  text-align: left;
  box-shadow: 2px 0 6px rgba(16,24,40,0.06);
}
.roster-table th.col-sticky { background: var(--surface-2); z-index: 5; }
.roster-table th.is-today { background: var(--accent-subtle); color: var(--accent); }
.roster-cell-btn {
  width: 100%; min-height: 58px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  padding: 6px 8px;
  text-align: left;
  display: flex; flex-direction: column; gap: 3px;
  transition: border-color 140ms, background 140ms;
}
.roster-cell-btn:hover { border-color: var(--accent); background: var(--accent-subtle); }
.roster-cell-btn.is-off { background: var(--idle-bg); border-style: dashed; }
.roster-cell-btn.is-leave { background: var(--overdue-bg); border-color: var(--overdue-border); }
.roster-cell-btn.is-relief { background: var(--break-bg); border-color: var(--break-border); }
.roster-cell-btn.is-conflict { background: var(--rework-bg); border-color: var(--rework); }

/* Dashboard 7-Status Strip */
.status-grid-7 {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 8px;
}
.mode-mobile .status-grid-7 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

/* Master-Detail Areas Split */
.areas-split {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
.mode-mobile .areas-split {
  grid-template-columns: 1fr;
}

/* Export 2-Column Layout */
.export-split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 290px;
  gap: 16px;
  align-items: start;
}
.mode-mobile .export-split { grid-template-columns: 1fr; }

/* A4 Print Sign Sheet (Preserved Exact Wall Sign Standard) */
.a4-preview-stage {
  background: var(--skeleton);
  border-radius: var(--r-lg);
  padding: 20px;
  overflow-x: auto;
}
.a4-sheet {
  background: #FFFFFF;
  color: #000000;
  width: 620px;
  margin: 0 auto;
  padding: 18px;
  box-shadow: var(--shadow-sm);
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0;
}
.a4-sheet.size-a5 { grid-template-columns: 1fr; }
.sign-card {
  border: 1.5px dashed #9AA3A4;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
}
.sign-type-tag {
  font-size: 12px; font-weight: 800; letter-spacing: 0.04em;
  border: 1.5px solid #000; padding: 2px 10px;
}
.sign-qr-box {
  width: 112px; height: 112px;
  border: 2px solid #000;
  padding: 6px;
  display: flex; align-items: center; justify-content: center;
}
.a4-sheet.size-a5 .sign-qr-box { width: 170px; height: 170px; }

/* ==========================================================================
   7. OVERLAYS: MODAL, DRAWER, MOBILE BOTTOM SHEET, TOAST WITH UNDO, COMMAND K
   ========================================================================== */
.overlay-backdrop {
  position: absolute;
  inset: 0;
  background: var(--backdrop);
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 150ms ease-out;
}
.overlay-backdrop.align-right {
  justify-content: flex-end;
  padding: 0;
}
.overlay-backdrop.align-left {
  justify-content: flex-start;
  padding: 0;
}
.mode-mobile .overlay-backdrop:not(.align-left) {
  align-items: flex-end;
  justify-content: center;
  padding: 0;
}

.dialog-box {
  background: var(--surface);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-overlay);
  width: 100%;
  max-width: 500px;
  max-height: 88%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: scaleIn 180ms var(--ease-out);
}
.drawer-box {
  background: var(--surface);
  box-shadow: var(--shadow-overlay);
  width: 100%;
  max-width: 480px;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: slideRight 200ms var(--ease-out);
}
.nav-drawer-box {
  background: var(--surface);
  box-shadow: var(--shadow-overlay);
  width: 84%;
  max-width: 300px;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 14px 12px;
  gap: 12px;
}

/* On Mobile, Modal & Drawer automatically become Thumb-Friendly Bottom Sheets */
.mode-mobile .dialog-box,
.mode-mobile .drawer-box {
  max-width: 100%;
  height: auto;
  max-height: 86%;

/* ==========================================================================
   NAVIGATION & STUDIO CONTROLLER
   ========================================================================== */
function switchRole(role) {
  const first = Object.keys(SCREENS).find(k => SCREENS[k].role === role);
  if (first) goTo(first);
}

function goTo(screenId, opts = {}) {
  if (!SCREENS[screenId]) return;
  if (state.captureTimer) { clearInterval(state.captureTimer); state.captureTimer = null; }
  state.screen = screenId;
  state.mobileNavOpen = false;
  state.overlay = null;
  if (!opts.keepViewport && SCREENS[screenId].defaultVp) {
    state.viewport = SCREENS[screenId].defaultVp;
  }
  renderAll();
}

function setViewport(vp) {
  state.viewport = vp;
  state.mobileNavOpen = false;
  renderAll();
}

function toggleHeuristics() {
  state.heuristicsOpen = !state.heuristicsOpen;
  renderStudioChrome();
}

function showToast(message, opts = {}) {
  if (state.toastTimer) clearTimeout(state.toastTimer);
  state.toast = {
    message,
    tone: opts.tone || 'ok',
    undoLabel: opts.undoLabel || '',
    onUndo: opts.onUndo || null
  };
  renderToast();
  if (opts.tone !== 'error') {
    state.toastTimer = setTimeout(() => {
      state.toast = null;
      renderToast();
    }, 5500);
  }
}

function triggerToastUndo() {
  if (state.toast && typeof state.toast.onUndo === 'function') {
    const fn = state.toast.onUndo;
    state.toast = null;
    fn();
    showToast('ย้อนกลับการทำรายการเรียบร้อยแล้ว');
  }
}

function closeToast() {
  state.toast = null;
  renderToast();
}

function openOverlay(type, payload = {}) {
  state.overlay = { type, payload };
  renderOverlay();
}

function closeOverlay() {
  state.overlay = null;
  renderOverlay();
}

function openCommandPalette() {
  openOverlay('command-palette', { query: '' });
  setTimeout(() => {
    const el = document.getElementById('cmd-input');
    if (el) el.focus();
  }, 40);
}

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openCommandPalette();
  }
  if (e.key === 'Escape') {
    if (state.overlay) closeOverlay();
    else if (state.mobileNavOpen) { state.mobileNavOpen = false; renderApp(); }
  }
});

/* ==========================================================================
   SHARED SHELLS: PHONE SHELL & ADMIN SHELL
   ========================================================================== */
function renderPhoneShell({ title, subtitle, backTo, backLabel, live, bottomNav, dock, body, roleLabel }) {
  const topLeft = backTo
    ? `<button type="button" class="btn btn-ghost btn-sm" style="padding:0 8px;min-height:42px;color:var(--accent);" onclick="goTo('${backTo}')">${ic('chevron-left','icon-md')}<span>${backLabel || 'กลับ'}</span></button>
       <div style="min-width:0;"><div class="phone-topbar-title">${title}</div>${subtitle ? `<div class="phone-topbar-sub">${subtitle}</div>` : ''}</div>`
    : `<div style="min-width:0;flex:1;">
         <div class="row" style="gap:6px;">
           <span class="phone-topbar-title">${title}</span>
           ${live ? `<span class="live-pill ${state.adminLiveStatus === 'reconnecting' ? 'reconnecting' : ''}"><span class="dot"></span>${state.adminLiveStatus === 'reconnecting' ? 'เชื่อมใหม่' : 'สด'}</span>` : ''}
         </div>
         ${subtitle ? `<div class="phone-topbar-sub">${subtitle}</div>` : ''}
       </div>`;

  const topRight = `
    <div class="phone-topbar-actions">
      <button type="button" class="topbar-pill-btn" onclick="openOverlay('help-sheet', { role: '${roleLabel || 'cleaner'}' })">${ic('help-circle','icon-sm')}<span>ช่วย</span></button>
      <button type="button" class="topbar-pill-btn" onclick="openOverlay('account-sheet', { role: '${roleLabel || 'cleaner'}' })">${ic('user','icon-sm')}<span>บัญชี</span></button>
    </div>`;

  let navHtml = '';
  if (bottomNav === 'cleaner') {
    navHtml = `
      <nav class="phone-bottom-nav" aria-label="เมนูหลักแม่บ้าน">
        <button type="button" class="bnav-item ${state.screen === 'my-work' ? 'active' : ''}" onclick="goTo('my-work', {keepViewport:true})">
          ${ic('clipboard-list','icon-md')}<span>งานของฉัน</span><span class="bnav-badge">3</span>
        </button>
        <button type="button" class="bnav-item ${state.screen === 'my-schedule' ? 'active' : ''}" onclick="goTo('my-schedule', {keepViewport:true})">
          ${ic('calendar','icon-md')}<span>ตารางของฉัน</span>
        </button>
        <button type="button" class="bnav-item ${state.screen === 'help' ? 'active' : ''}" onclick="openOverlay('help-sheet', { role: 'cleaner' })">
          ${ic('help-circle','icon-md')}<span>ช่วยเหลือ</span>
        </button>
      </nav>`;
  } else if (bottomNav === 'supervisor') {
    navHtml = `
      <nav class="phone-bottom-nav" aria-label="เมนูหลักหัวหน้างาน">
        <button type="button" class="bnav-item ${state.screen === 'my-building' ? 'active' : ''}" onclick="goTo('my-building', {keepViewport:true})">
          ${ic('building','icon-md')}<span>ตึกของฉัน</span><span class="bnav-badge">3</span>
        </button>
        <button type="button" class="bnav-item ${state.screen === 'sup-schedules' ? 'active' : ''}" onclick="goTo('sup-schedules', {keepViewport:true})">
          ${ic('calendar','icon-md')}<span>ตารางทีม</span>
        </button>
        <button type="button" class="bnav-item" onclick="openOverlay('help-sheet', { role: 'supervisor' })">
          ${ic('help-circle','icon-md')}<span>ช่วยเหลือ</span>
        </button>
      </nav>`;
  }

  return `
    <div class="phone-shell">
      <header class="phone-topbar">${topLeft}${topRight}</header>
      <main class="phone-body">${body}</main>
      ${dock ? `<div class="phone-dock">${dock}</div>` : ''}
      ${navHtml}
    </div>`;
}

/* ---------- B3. Cleaner: Check-In (/check-in/:token) ---------- */
function screenCheckIn() {
  const steps = [
    { key: 'ShiftIn', label: '1. เข้างาน', plan: 'ก่อน 07:00', time: state.checkInStep >= 1 ? '06:54' : null },
    { key: 'Break1Out', label: '2. ออกพักรอบที่ 1', plan: 'ตามแผน 09:30', time: state.checkInStep >= 2 ? (state.checkInGaps.includes(2) ? 'ข้าม' : '09:31') : null },
    { key: 'Break1In', label: '3. กลับจากพักรอบที่ 1', plan: 'ตามแผน 09:45', time: state.checkInStep >= 3 ? (state.checkInGaps.includes(3) ? 'ข้าม' : '09:46') : null },
    { key: 'Break2Out', label: '4. ออกพักรอบที่ 2 (ก่อน OT)', plan: 'ตามแผน 15:00', time: state.checkInStep >= 4 ? (state.checkInGaps.includes(4) ? 'ข้าม' : '15:02') : null },
    { key: 'Break2In', label: '5. กลับจากพักรอบที่ 2', plan: 'ตามแผน 15:15', time: state.checkInStep >= 5 ? (state.checkInGaps.includes(5) ? 'ข้าม' : '15:16') : null },
    { key: 'ShiftOut', label: '6. เลิกงาน', plan: 'ตามแผน 19:00', time: state.checkInStep >= 6 ? '19:01' : null }
  ];
  const nextIdx = state.checkInStep;
  const nextStep = steps[nextIdx];

  const body = `
    <div class="card card-compact row-between">
      <div class="col-sm">
        <span class="small muted">ป้ายลงเวลาพื้นที่ของคุณ</span>
        <strong>A-101 แคนทีนและลานพักกลาง · ตึก B1</strong>
        <span class="small muted">กะเช้า 07:00–19:00 · กลุ่มพัก 1</span>
      </div>
      <span class="chip chip-passed">${ic('map-pin','icon-sm')}<span>GPS พร้อม</span></span>
    </div>

    ${state.checkInTransferPending ? `
      <div class="note note-warn">
        ${ic('arrow-right-left','icon-md')}
        <div class="note-body">
          <span class="note-title">มีคำสั่งย้ายพื้นที่ระหว่างกะ</span>
          <span>หัวหน้าสั่งย้ายคุณไปทำที่ <strong>A-103 ห้องน้ำชั้น 2</strong> กดปุ่มด้านล่างเพื่อยืนยันว่าถึงพื้นที่ใหม่แล้ว (คงเวลาเข้างาน 06:54 เดิมไว้)</span>
        </div>
      </div>` : ''}

    <!-- 6-Step Visual Timeline -->
    <div class="timeline" aria-label="ลำดับการลงเวลา 6 ขั้นตอน">
      ${steps.map((s, i) => {
        const isDone = i < state.checkInStep && !state.checkInGaps.includes(i + 1);
        const isMissed = state.checkInGaps.includes(i + 1);
        const isNext = i === state.checkInStep;
        const cls = isMissed ? 'missed' : isDone ? 'done' : isNext ? 'next' : '';
        return `
          <div class="tl-step ${cls}">
            <span class="tl-num">${isDone ? ic('check','icon-sm') : isMissed ? ic('alert-triangle','icon-sm') : (i + 1)}</span>
            <div class="tl-info">
              <div class="tl-label">${s.label}</div>
              <div class="tl-sub">${isMissed ? 'ข้ามขั้นตอน (รอหัวหน้าตรวจเติมเวลา)' : isNext ? 'ขั้นตอนถัดไปของคุณ' : s.plan}</div>
            </div>
            <div class="tl-time" style="color:${isMissed?'var(--overdue)':isDone?'var(--passed)':isNext?'var(--accent)':'var(--text-2)'};">
              ${isMissed ? 'ขาดเวลา' : (s.time || '—')}
            </div>
          </div>`;
      }).join('')}
    </div>

    <div class="card card-compact row-wrap" style="background:var(--surface-2);">
      <span class="small muted bold" style="width:100%;">ทดสอบสถานการณ์จำลอง:</span>
      <button type="button" class="btn btn-secondary btn-sm" onclick="state.checkInTransferPending=!state.checkInTransferPending; renderApp();">${state.checkInTransferPending ? 'ปิดคำสั่งย้ายพื้นที่' : 'จำลองมีคำสั่งย้ายพื้นที่'}</button>
      <button type="button" class="btn btn-secondary btn-sm" onclick="state.checkInStep=1; state.checkInGaps=[]; renderApp();">รีเซ็ตเป็นเข้างานแล้ว</button>
    </div>`;

  let dock = '';
  if (state.checkInTransferPending) {
    dock = `
      <button type="button" class="btn btn-primary btn-main" onclick="state.checkInTransferPending=false; renderApp(); showToast('ยืนยันถึงพื้นที่ใหม่ A-103 เรียบร้อยแล้ว');">
        ${ic('check-circle','icon-md')}<span>ยืนยันเข้าพื้นที่ใหม่ (A-103)</span>
      </button>`;
  } else if (nextStep) {
    dock = `
      <button type="button" class="btn btn-primary btn-main" onclick="recordCheckInStep(${nextIdx + 1})">
        ${ic('clock','icon-md')}<span>บันทึก: ${nextStep.label.replace(/^\d+\.\s/,'')}</span>
      </button>
      ${nextIdx < 5 ? `
        <button type="button" class="btn btn-secondary btn-phone btn-full" onclick="openOverlay('skip-checkin-sheet')">
          <span>ลืมสแกนรอบก่อน? ข้ามไปขั้นตอนอื่น / เลิกงาน</span>
        </button>` : ''}`;
  } else {
    dock = `
      <div class="note note-success">${ic('check-circle','icon')}<span>ลงเวลาครบทั้ง 6 ขั้นตอนของกะนี้แล้ว ขอบคุณที่ตั้งใจทำงานครับ</span></div>
      <button type="button" class="btn btn-secondary btn-phone btn-full" onclick="goTo('my-work',{keepViewport:true})">กลับหน้างานของฉัน</button>`;
  }

  return renderPhoneShell({
    title: 'ลงเวลาเข้า-ออกพื้นที่',
    subtitle: 'สแกนจากป้ายลงเวลา A-101',
    backTo: 'my-work',
    backLabel: 'งานของฉัน',
    body,
    dock,
    roleLabel: 'cleaner'
  });
}

function recordCheckInStep(stepNum) {
  const prev = state.checkInStep;
  state.checkInStep = stepNum;
  renderApp();
  showToast('บันทึกเวลาเรียบร้อยแล้ว (09:42 น.)', {
    undoLabel: 'จำลองย้อนกลับ',
    onUndo: () => { state.checkInStep = prev; renderApp(); }
  });
}

function updateScanDock() {
  const btn = document.getElementById('btn-submit-scan');
  if (!btn) return;
  const canSend = state.scanChoice === 'Normal' || (state.scanChoice === 'Issue' && (state.scanTags.length > 0 || state.scanNote.trim().length > 0));
  btn.disabled = !canSend;
}

function toggleArrayItem(arr, val) {
  const i = arr.indexOf(val);
  if (i >= 0) arr.splice(i, 1);
  else arr.push(val);
}

/* ---------- D2. Admin Live Point Board (/dashboard) ---------- */
function screenDashboard() {
  const allPts = AREAS_DATA.flatMap(a => a.points.map(p => ({ ...p, areaCode: a.code, areaName: a.name, building: a.building })));
  const counts = {};
  Object.keys(STATUS_META).forEach(k => counts[k] = allPts.filter(p => p.status === k).length);

  const q = state.dashSearch.trim().toLowerCase();
  const filteredAreas = AREAS_DATA.filter(a => state.dashBuilding === 'all' || a.building === state.dashBuilding)
    .map(a => ({
      ...a,
      points: a.points.filter(p =>
        (state.dashStatusFilter === 'all' || p.status === state.dashStatusFilter) &&
        (!state.dashIssueOnly || Boolean(p.issue)) &&
        (!q || p.name.toLowerCase().includes(q) || a.name.toLowerCase().includes(q) || a.code.toLowerCase().includes(q))
      )
    })).filter(a => a.points.length > 0);

  const hasFilter = state.dashStatusFilter !== 'all' || state.dashIssueOnly || state.dashBuilding !== 'all' || q;

  const body = `
    <header class="page-head">
      <div>
        <h1 class="page-title">${ic('layout-grid','icon-lg')}<span>สถานะจุดสด</span></h1>
        <p class="page-desc">อัปเดตอัตโนมัติเมื่อแม่บ้านส่งงานหรือหัวหน้าตรวจ · เรียงพื้นที่ที่มีปัญหาขึ้นก่อน</p>
      </div>
      <div class="page-actions">
        ${hasFilter ? `<button type="button" class="btn btn-secondary btn-desk" onclick="state.dashStatusFilter='all'; state.dashIssueOnly=false; state.dashBuilding='all'; state.dashSearch=''; renderApp();">${ic('rotate-ccw','icon-sm')}<span>ล้างตัวกรอง</span></button>` : ''}
      </div>
    </header>

    <!-- 7 Interactive Status Filter Cards -->
    <div class="status-grid-7" role="group" aria-label="กรองตามสถานะจุด">
      ${Object.entries(STATUS_META).map(([key, meta]) => `
        <button type="button" class="kpi-card ${state.dashStatusFilter===key?'active':''}" style="padding:10px 12px;" onclick="state.dashStatusFilter = state.dashStatusFilter==='${key}'?'all':'${key}'; renderApp();">
          <div class="kpi-top" style="font-size:12.5px;"><span>${meta.label}</span>${ic(meta.icon,'icon-sm')}</div>
          <div class="kpi-val" style="font-size:22px;">${counts[key] || 0}</div>
        </button>`).join('')}
    </div>

    <!-- Search + Building + Issue Filter (With Recent Search Chips - Heuristic 6) -->
    <section class="filter-bar">
      <div class="field field-grow">
        <label class="field-label" for="dash-q">ค้นหาพื้นที่หรือจุดบริการ</label>
        <input id="dash-q" class="input" type="search" value="${state.dashSearch}" placeholder="พิมพ์ชื่อจุด รหัสพื้นที่ เช่น แคนทีน, ห้องน้ำ..." oninput="state.dashSearch=this.value; renderApp();">
        <div class="quick-chips" style="margin-top:4px;">
          <span class="small muted">ค้นหาด่วน:</span>
          ${['ห้องน้ำ', 'แคนทีน', 'A-101'].map(term => `<button type="button" class="quick-chip" style="min-height:28px;padding:2px 9px;font-size:12.5px;" onclick="state.dashSearch='${term}'; renderApp();">${term}</button>`).join('')}
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="dash-b">ตึก</label>
        <select id="dash-b" class="select" onchange="state.dashBuilding=this.value; renderApp();">
          <option value="all" ${state.dashBuilding==='all'?'selected':''}>ทุกตึก</option>
          <option value="B1" ${state.dashBuilding==='B1'?'selected':''}>ตึก B1</option>
          <option value="B2" ${state.dashBuilding==='B2'?'selected':''}>ตึก B2</option>
        </select>
      </div>
      <div class="field">
        <span class="field-label">ป้ายปัญหา (Issue)</span>
        <button type="button" class="btn ${state.dashIssueOnly?'btn-danger-solid':'btn-secondary'} btn-desk" onclick="state.dashIssueOnly=!state.dashIssueOnly; renderApp();">
          ${ic('alert-triangle','icon-sm')}<span>เฉพาะที่พบปัญหา (2)</span>
        </button>
      </div>
    </section>

    ${filteredAreas.length === 0 ? `
      <div class="card col" style="text-align:center;align-items:center;padding:32px;">
        ${ic('search','icon-xl')}
        <strong>ไม่พบจุดที่ตรงกับตัวกรอง</strong>
        <button type="button" class="btn btn-primary btn-desk" onclick="state.dashStatusFilter='all'; state.dashIssueOnly=false; state.dashBuilding='all'; state.dashSearch=''; renderApp();">แสดงทุกจุดทั้งหมด</button>
      </div>` : filteredAreas.map(area => {
        const hasProblem = area.points.some(p => p.status==='Rework'||p.status==='Overdue'||p.issue);
        return `
          <details class="disclosure" ${hasProblem || hasFilter ? 'open' : ''}>
            <summary>
              <div class="row-wrap">
                <strong style="font-size:16px;">${area.code} ${area.name}</strong>
                <span class="chip chip-idle">ตึก ${area.building}</span>
                <span class="small muted">${area.points.length} จุด · แม่บ้าน: ${area.cleanerDay}</span>
              </div>
              ${ic('chevron-down','icon')}
            </summary>
            <div class="disclosure-body" style="padding:14px;">
              <div class="grid-2">
                ${area.points.map(p => `
                  <div class="point-row" style="${p.status==='Rework'?'border-color:var(--rework-border);background:#FFFDFD;':p.status==='Overdue'?'border-color:var(--overdue-border);':''}">
                    <div class="point-row-top">
                      <span class="point-row-name" style="font-size:15px;">${p.name}</span>
                      ${statusChip(p.status)}
                    </div>
                    <div class="point-row-meta small">
                      <span class="tabular">รอบ ${p.rounds[0]}</span>
                      <span class="tabular">ส่งล่าสุด: ${p.lastTime}</span>
                    </div>
                    ${p.issue ? `<span class="chip chip-rework" style="align-self:flex-start;">${ic('alert-triangle','icon-sm')}<span>พบปัญหา: ${p.issue}</span></span>` : ''}
                    ${p.defect ? `<div class="defect-box" style="font-size:13px;">หัวหน้าให้แก้: "${p.defect}"</div>` : ''}
                  </div>`).join('')}
              </div>
            </div>
          </details>`;
      }).join('')}
  `;
  return renderAdminShell('สถานะจุดสด', body);
}

              </div>`).join('')}
          </div>
        </div>`}
    </section>`;

  return renderAdminShell('รายการที่ขึ้นเตือน', body);
}

function markAlertReviewed(id) {
  const item = state.alerts.find(a => a.id === id);
  if (!item) return;
  item.reviewed = true;
  renderApp();
  showToast(`บันทึกว่าคุยรายการของ ${item.actor} แล้ว`, {
    undoLabel: 'เลิกทำ',
    onUndo: () => { item.reviewed = false; renderApp(); }
  });
}

function simulateExport() {
  state.exporting = true;
  state.exportProgress = 15;
  renderApp();
  const iv = setInterval(() => {
    state.exportProgress += 28;
    if (state.exportProgress >= 100) {
      state.exportProgress = 100;
      clearInterval(iv);
      renderApp();
      setTimeout(() => {
        state.exporting = false;
        renderApp();
        showToast('ดาวน์โหลดไฟล์ janitorial-report-20261120.xlsx สำเร็จแล้ว');
      }, 350);
    } else {
      renderApp();
    }
  }, 260);
}

  const body = `

    </div>

    <div class="col">
      <label class="field-label">1. เลือกป้ายที่จะเก็บพิกัด (${area.code} ${area.name})</label>

        ${signs.map(s => `
          <button type="button" class="point-row" style="text-align:left;cursor:pointer;${s.id===sel.id?'border:2px solid var(--accent);background:var(--accent-subtle);':''}" onclick="if(state.capturePhase!=='reading'){state.captureSignId='${s.id}'; state.capturePhase='idle'; renderApp();}">
            <div class="row-between">
              <strong style="font-size:15px;">${s.title}</strong>
              ${s.captured ? '<span class="chip chip-passed">มีพิกัดแล้ว</span>' : '<span class="chip chip-overdue">ยังไม่มี</span>'}

            <div class="small muted tabular">${s.coords}</div>
          </button>`).join('')}
      </div>
    </div>

    ${state.capturePhase === 'reading' ? `
      <div class="card col" style="border:2px solid var(--accent);background:var(--accent-subtle);">
        <div class="row-between bold" style="color:var(--accent);">
          <span class="row">${ic('loader','icon spin')}<span>กำลังอ่านสัญญาณ GPS...</span></span>
          <span class="tabular">${state.captureSeconds} / 30 วินาที</span>
        </div>
        <div class="progress-track"><div class="progress-fill-accent" style="width:${pct}%"></div></div>
        <div class="small" style="color:var(--text-3);">ยืนนิ่งๆ หน้าป้าย <strong>${sel.title}</strong> · เก็บตัวอย่างแล้ว ${Math.max(1, Math.floor(state.captureSeconds / 2))} ค่า · ความคลาดเคลื่อนเฉลี่ย ±6 ม.</div>
      </div>` : ''}

    ${state.capturePhase === 'result' ? `
      <div class="card col" style="border:2px solid var(--passed);background:var(--passed-bg);">

          ${ic('check-circle','icon-md')}<span>อ่านพิกัดสำเร็จ — ความแม่นยำระดับดีมาก (±5 เมตร)</span>
        </div>
        <div class="small tabular" style="color:var(--text);">พิกัดค่ากลาง: <strong>13.75642, 100.50185</strong> (จาก 15 ตัวอย่าง)</div>

      </div>` : ''}
  `;

  let dock = '';
  if (state.capturePhase === 'reading') {
    dock = `
      <button type="button" class="btn btn-danger btn-main" onclick="stopCapture(false)">
        ${ic('x','icon-md')}<span>หยุดและยกเลิกการอ่านพิกัด</span>
      </button>`;
  } else if (state.capturePhase === 'result') {

      </button>`;
  }

  return renderPhoneShell({
    title: 'เก็บพิกัดป้าย (แอดมิน)',

    body,

    roleLabel: 'admin'
  });

function startCaptureSim() {
  state.capturePhase = 'reading';
  state.captureSeconds = 0;
  renderApp();
  state.captureTimer = setInterval(() => {
    state.captureSeconds += 5; // fast-forward 5s per 450ms for smooth interactive preview
    if (state.captureSeconds >= 30) {
      stopCapture(true);
    } else {
      renderApp();
    }
  }, 420);
}

function stopCapture(completed) {
  if (state.captureTimer) { clearInterval(state.captureTimer); state.captureTimer = null; }
  state.capturePhase = completed ? 'result' : 'idle';
  renderApp();
  if (!completed) showToast('ยกเลิกการอ่านพิกัดแล้ว');
}

function saveCapturedCoords(title) {
  state.capturePhase = 'idle';
  renderApp();
  showToast(`บันทึกพิกัดป้าย "${title}" เรียบร้อยแล้ว`);
}

function toggleAccountStatus(id) {
  const acc = state.accounts.find(a => a.id === id);
  if (!acc) return;
  if (acc.active) {
    openOverlay('confirm', {
      title: `ปิดใช้งานบัญชี "${acc.name}" ใช่ไหม?`,
      message: 'บัญชีนี้จะไม่สามารถเข้าสู่ระบบหรือสแกนป้ายได้ทันที แต่ประวัติการทำงานทั้งหมดจะยังคงอยู่ และคุณสามารถเปิดใช้งานกลับคืนได้ทุกเมื่อ',
      confirmLabel: 'ยืนยันปิดใช้งาน',
      danger: true,
      onConfirm: () => {
        acc.active = false;
        closeOverlay();
        renderApp();
        showToast(`ปิดใช้งานบัญชี ${acc.name} แล้ว`, {
          undoLabel: 'เลิกทำ',
          onUndo: () => { acc.active = true; renderApp(); }
        });
      }
    });
  } else {
    acc.active = true;
    renderApp();
    showToast(`เปิดใช้งานบัญชี ${acc.name} กลับคืนแล้ว`);
  }
}

  return `

        <div class="dialog-head">
          <h2 class="dialog-title">${title}</h2>
          <button type="button" class="dialog-close" aria-label="ปิดหน้าต่าง" onclick="closeOverlay()">${ic('x','icon-md')}</button>

        <button type="button" class="btn btn-primary btn-desk" style="min-height:44px;" onclick="closeOverlay(); showToast('บันทึกข้อมูลเรียบร้อยแล้ว');">${ic('check','icon-sm')}<span>บันทึก</span></button>`
    });
  } else if (type === 'building-drawer') {
    const b = payload.id ? state.buildings.find(x => x.id === payload.id) : null;
    const blocked = b && b.active && b.activeAreas > 0;
    html = overlayWrapper({
      title: b ? `แก้ไขตึก ${b.code}` : 'เพิ่มตึกใหม่',
      drawer: true,
      body: `
        <div class="field"><label class="field-label">รหัสตึก (A-Z / 0-9) <span class="field-req">*</span></label><input class="input mono" ${b?'disabled':''} value="${b?b.code:''}" placeholder="เช่น B5"></div>
        <div class="field"><label class="field-label">ชื่อตึก <span class="field-req">*</span></label><input class="input" value="${b?b.name:''}" placeholder="เช่น อาคารคลังสินค้าใหม่"></div>
        ${b ? `
          <div class="divider"></div>
          ${blocked ? `
            <div class="note note-warn">${ic('shield-alert','icon-md')}<span>ยังไม่สามารถปิดใช้งานตึกนี้ได้ เนื่องจากยังมี <strong>${b.activeAreas} พื้นที่</strong> และหัวหน้างานที่เปิดใช้งานอยู่</span></div>` : `
            <button type="button" class="btn ${b.active?'btn-danger':'btn-subtle'} btn-desk btn-full" onclick="b_toggle('${b.id}')">${b.active ? 'ปิดใช้งานตึกนี้' : 'เปิดใช้งานตึกนี้กลับคืน'}</button>`}` : ''}`,
      footer: `
        <button type="button" class="btn btn-secondary btn-desk" style="min-height:44px;" onclick="closeOverlay()">ยกเลิก</button>
        <button type="button" class="btn btn-primary btn-desk" style="min-height:44px;" onclick="closeOverlay(); showToast('บันทึกข้อมูลตึกเรียบร้อยแล้ว');">${ic('check','icon-sm')}<span>บันทึก</span></button>`
    });
  } else if (type === 'account-drawer') {
    const acc = payload.id ? state.accounts.find(x => x.id === payload.id) : null;
    const role = acc ? acc.role : (payload.role || 'cleaner');
    html = overlayWrapper({
      title: acc ? `แก้ไขบัญชี: ${acc.name}` : 'สร้างบัญชีผู้ใช้ใหม่',
      drawer: true,
      body: `
        <div class="field">
          <label class="field-label">บทบาทผู้ใช้</label>
          <select class="select" ${acc?'disabled':''}>
            <option ${role==='cleaner'?'selected':''}>แม่บ้าน (Cleaner)</option>
            <option ${role==='supervisor'?'selected':''}>หัวหน้างาน (Supervisor)</option>
            <option ${role==='admin'?'selected':''}>แอดมิน (Admin)</option>
          </select>
        </div>
        <div class="field"><label class="field-label">ชื่อ-นามสกุล <span class="field-req">*</span></label><input class="input" value="${acc?acc.name:''}" placeholder="เช่น นางสาวสมใจ รักสะอาด"></div>
        <div class="field"><label class="field-label">${role==='admin'?'ชื่อผู้ใช้':'รหัสพนักงาน 7 หลัก'} <span class="field-req">*</span></label><input class="input mono" value="${acc?acc.empId:''}" placeholder="${role==='admin'?'admin.name':'1004500'}"></div>
        ${role==='cleaner' ? `
          <div class="field">
            <label class="field-label">ประเภทแม่บ้าน</label>
            <div class="segmented" style="width:100%;">
              <button type="button" style="flex:1;" class="${!acc||acc.kind!=='Relief'?'active':''}">ประจำพื้นที่</button>
              <button type="button" style="flex:1;" class="${acc&&acc.kind==='Relief'?'active':''}">แม่บ้านสำรอง (สแปร์)</button>
            </div>
          </div>
          <div class="field"><label class="field-label">พื้นที่ประจำ / ตึกประจำ (สแปร์)</label><select class="select"><option>A-101 แคนทีนและลานพักกลาง · ตึก B1</option><option>ตึกประจำ B1 (สำหรับสแปร์)</option></select></div>` : ''}
        ${role==='supervisor' ? `
          <div class="field">
            <label class="field-label">ตึกที่รับผิดชอบ (เลือกได้หลายตึก)</label>
            <div class="quick-chips">
              <button type="button" class="quick-chip selected">${ic('check','icon-sm')}<span>ตึก B1</span></button>
              <button type="button" class="quick-chip selected">${ic('check','icon-sm')}<span>ตึก B2</span></button>
              <button type="button" class="quick-chip">${ic('plus','icon-sm')}<span>ตึก B3</span></button>
            </div>
          </div>` : ''}
        <div class="divider"></div>
        <div class="field">
          <label class="field-label">${role==='admin'?'ตั้งรหัสผ่านใหม่ (ไม่บังคับหากไม่เปลี่ยน)':'เบอร์โทรศัพท์สำหรับเข้าสู่ระบบ'}</label>
          <input class="input" type="${role==='admin'?'password':'tel'}" placeholder="${role==='admin'?'กรอกเฉพาะเมื่อต้องการเปลี่ยนรหัส':'เช่น 0891234567'}">
        </div>`,
      footer: `
        <button type="button" class="btn btn-secondary btn-desk" style="min-height:44px;" onclick="closeOverlay()">ยกเลิก</button>
        <button type="button" class="btn btn-primary btn-desk" style="min-height:44px;" onclick="closeOverlay(); showToast('บันทึกข้อมูลบัญชีผู้ใช้เรียบร้อยแล้ว');">${ic('check','icon-sm')}<span>บันทึกบัญชี</span></button>`
    });
  } else if (type === 'command-palette') {
    const q = (payload.query || '').trim().toLowerCase();
    const matches = Object.entries(SCREENS).filter(([id, s]) => !q || s.title.toLowerCase().includes(q) || s.route.toLowerCase().includes(q));
    html = overlayWrapper({
      title: 'ทางลัดไปทุกหน้าในระบบ (24 หน้า)',
      body: `
        <input id="cmd-input" class="input" type="search" value="${payload.query || ''}" placeholder="พิมพ์ชื่อหน้า หรือเส้นทาง เช่น ลงเวลา, Excel, พิมพ์ป้าย..." oninput="state.overlay.payload.query=this.value; renderCommandList();">
        <div id="cmd-list" class="list-stack" style="max-height:360px;overflow-y:auto;">
          ${renderCommandItems(matches)}
        </div>`,
      footer: `<button type="button" class="btn btn-secondary btn-desk" style="min-height:42px;grid-column:span 2;" onclick="closeOverlay()">ปิด (Esc)</button>`
    });
  }

  const wrap = document.createElement('div');
  wrap.className = 'js-overlay-root';
  wrap.innerHTML = html;
  host.appendChild(wrap);
}

function renderCommandItems(entries) {
  return entries.map(([id, s]) => `
    <button type="button" class="point-row" style="text-align:left;cursor:pointer;padding:10px 12px;" onclick="closeOverlay(); goTo('${id}');">
      <div class="row-between">
        <strong style="font-size:14.5px;">${s.title}</strong>
        <span class="chip chip-idle mono" style="font-size:11.5px;">${s.route}</span>
      </div>
    </button>`).join('');
}

function renderCommandList() {
  const el = document.getElementById('cmd-list');
  if (!el || !state.overlay) return;
  const q = (state.overlay.payload.query || '').trim().toLowerCase();
  const matches = Object.entries(SCREENS).filter(([id, s]) => !q || s.title.toLowerCase().includes(q) || s.route.toLowerCase().includes(q));
  el.innerHTML = renderCommandItems(matches);
}

function saveAttendanceCorrection(rowId) {
  const row = state.attRows.find(r => r.id === rowId);
  const ev = document.getElementById('ca-ev')?.value || 'ShiftIn';
  const tm = document.getElementById('ca-time')?.value || '07:05';
  if (row) {
    const prevVal = row.events[ev];
    const prevState = row.state;
    const prevEdited = row.edited;
    row.events[ev] = tm;
    if (ev === 'ShiftIn' && row.state === 'Empty') row.state = 'Working';
    row.edited = true;
    closeOverlay();
    renderApp();
    showToast(`บันทึกเวลา ${tm} น. ให้ ${row.cleaner} แล้ว`, {
      undoLabel: 'เลิกทำ',
      onUndo: () => {
        row.events[ev] = prevVal;
        row.state = prevState;
        row.edited = prevEdited;
        renderApp();
      }
    });
  }
}

function b_toggle(id) {
  const b = state.buildings.find(x => x.id === id);
  if (!b) return;
  b.active = !b.active;
  closeOverlay();
  renderApp();
  showToast(b.active ? `เปิดใช้งานตึก ${b.code} แล้ว` : `ปิดใช้งานตึก ${b.code} แล้ว`);
}

function renderToast() {
  const host = document.getElementById('app-viewport');
  if (!host) return;
  const old = host.querySelector('.toast-slot');
  if (old) old.remove();
  if (!state.toast) return;

  const t = state.toast;
  const div = document.createElement('div');
  div.className = 'toast-slot';
  div.setAttribute('role', t.tone === 'error' ? 'alert' : 'status');
  div.innerHTML = `
    <div class="toast-card ${t.tone==='error'?'tone-error':t.tone==='warn'?'tone-warn':''}">
      ${ic(t.tone==='error'?'alert-triangle':'check-circle', 'icon-md')}
      <span class="toast-msg">${t.message}</span>
      ${t.undoLabel ? `<button type="button" class="toast-undo" onclick="triggerToastUndo()">${ic('undo','icon-sm')} ${t.undoLabel}</button>` : ''}
      <button type="button" class="dialog-close" style="color:#fff;width:30px;height:30px;" aria-label="ปิดข้อความ" onclick="closeToast()">${ic('x','icon-sm')}</button>
    </div>`;
  host.appendChild(div);
}

/* ==========================================================================
   MASTER RENDERER
   ========================================================================== */
const RENDERERS = {
  'login': screenLogin,
  'login-admin': screenLoginAdmin,
  'error-hub': screenErrorHub,
  'help': screenHelp,
  'my-work': screenMyWork,
  'my-schedule': screenMySchedule,
  'check-in': screenCheckIn,
  'scan-cleaner': screenScanCleaner,
  'my-building': screenMyBuilding,
  'scan-supervisor': screenScanSupervisor,
  'sup-schedules': screenSupSchedules,
  'admin-overview': screenAdminOverview,
  'dashboard': screenDashboard,
  'admin-attendance': screenAdminAttendance,
  'admin-schedules': screenAdminSchedules,
  'admin-alerts': screenAdminAlerts,
  'admin-inspection': screenAdminInspection,
  'admin-export': screenAdminExport,
  'admin-areas': screenAdminAreas,
  'admin-capture': screenAdminCapture,
  'admin-buildings': screenAdminBuildings,
  'admin-print': screenAdminPrint,
  'admin-accounts': screenAdminAccounts,
  'admin-history': screenAdminHistory
};

function renderStudioChrome() {
  const cur = SCREENS[state.screen];
  // Active Role Pill
  document.querySelectorAll('.role-pill').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.role === cur.role);
  });

  // Viewport toggle
  const frame = document.getElementById('device-frame');
  frame.classList.toggle('mode-mobile', state.viewport === 'mobile');
  frame.classList.toggle('mode-desktop', state.viewport === 'desktop');
  document.getElementById('vp-mobile').classList.toggle('active', state.viewport === 'mobile');
  document.getElementById('vp-desktop').classList.toggle('active', state.viewport === 'desktop');

  // Screen Strip for current role
  const roleNames = { auth: 'เข้าสู่ระบบ / Error / Help', cleaner: 'หน้าแม่บ้าน (มือถือ)', supervisor: 'หน้าหัวหน้างาน', admin: 'หน้าแอดมิน (ครบ 13 หน้า)' };
  const roleScreens = Object.entries(SCREENS).filter(([, s]) => s.role === cur.role);
  document.getElementById('screen-strip').innerHTML = `
    <span class="screen-strip-label">${ic('layout-grid','icon-sm')}<span>${roleNames[cur.role]}</span></span>
    ${roleScreens.map(([id, s]) => `
      <button type="button" class="screen-chip ${state.screen === id ? 'active' : ''}" onclick="goTo('${id}')">
        <span>${s.title}</span>
        <span class="route-tag">${s.route}</span>
      </button>`).join('')}`;

  // Heuristics Inspector Panel
  const panel = document.getElementById('heuristics-panel');
  const btnH = document.getElementById('btn-heuristics');
  panel.classList.toggle('open', state.heuristicsOpen);
  btnH.classList.toggle('active', state.heuristicsOpen);
  document.getElementById('heuristics-screen-name').textContent = `${cur.title} (${cur.route})`;
  document.getElementById('heuristics-list').innerHTML = HEURISTICS.map(h => {
    const hi = (cur.highlights || []).includes(h.id);
    const customNote = cur.notes && cur.notes[h.id];
    return `
      <div class="h-item ${hi ? 'highlighted' : ''}">
        <div class="h-item-head"><span class="h-num">${h.id}</span><span>${h.title.replace(/^\d+\.\s/,'')}</span></div>
        <div class="h-desc">${customNote || h.base}</div>
      </div>`;
  }).join('');
}

function renderApp() {
  const host = document.getElementById('app-viewport');
  const fn = RENDERERS[state.screen] || screenMyWork;
  host.innerHTML = fn();
  renderOverlay();
  renderToast();
}

function renderAll() {
  renderStudioChrome();
  renderApp();
}

// Bootstrap on load
renderAll();
</script>
</body>
</html>
