  if (!S.phone.net) { go('failed', { ...c, retry: { kind: 'att', type }, what: `${EVN[type]} · ป้ายลงเวลา ${c.area}-IN` }); return; }
  let rec = attRec(me.id, c.shift);
  const last = rec ? Math.max(...Object.values(rec.ev).map((e) => e.t)) : -1e9;
  if (S.now - last < CFG.debounce) { toast('กดซ้ำภายใน 5 นาที ระบบไม่นับ'); return; }
  if (!rec) { rec = { id: nid('att'), user: me.id, shift: c.shift, ev: {} }; S.att.push(rec); }
  const dist = gpsRead();
  rec.ev[type] = { t: S.now, dist, flag: dist > CFG.radius, src: 'scan' };
  go('checkinDone', { ...c, type, dist });
}
function myShiftNow(me) { const sh = shiftAt(S.now); return sh.type === me.shift ? sh : null; }
function scanPoint(me, p) {
  const sh = myShiftNow(me);
  if (!sh) { go('msg', { kind: 'blue', title: 'นอกกะของคุณ', body: `คุณอยู่${SHIFT_NAME[me.shift]} ส่งงานได้เฉพาะในกะของตัวเอง` }); return; }
  const rec = attRec(me.id, sh.key);
  if (!rec || !rec.ev.SHIFT_IN) { go('needCheckin', { point: p.id }); return; }
  const cover = p.area !== me.area ? coverOf(me.id, p.area, sh.key) : null;
  if (p.area !== me.area && !cover) { S.blocked.push({ id: nid('blk'), t: S.now, user: me.id, point: p.id, reason: 'area' }); go('blocked', { point: p.id }); return; }
  S.phone.sel = { status: 'NORMAL', tags: [], note: '' };
  go('submit', { point: p.id, cover: !!cover });
}
function doSubmit() {
  const me = U(S.phone.user); const c = S.phone.ctx; const p = PT(c.point); const sel = S.phone.sel;
  if (sel.status === 'ISSUE' && !sel.tags.length && !sel.note.trim()) { toast('เลือกปัญหาหรือเขียนหมายเหตุก่อนส่ง'); return; }
  if (!S.phone.net) { go('failed', { ...c, retry: { kind: 'sub' }, what: `${p.name} · ${sel.status === 'ISSUE' ? 'พบปัญหา' : 'เรียบร้อย'}` }); return; }
  const a = assignSubmission(p, S.now); const dist = gpsRead();
  const s = { id: nid('sub'), point: p.id, user: me.id, t: S.now, round: a.round, kind: a.kind, late: a.late || 0, status: sel.status, tags: [...sel.tags], note: sel.note.trim(), dist, flag: dist > CFG.radius, cover: !!c.cover };

}
function scanInspect(me, p) {
  const ar = A(p.area); const sh = shiftAt(S.now);
  if (ar.bld !== me.bld) { S.blocked.push({ id: nid('blk'), t: S.now, user: me.id, point: p.id, reason: 'bld' }); go('blocked', { point: p.id, sup: 'bld' }); return; }
  if (sh.type !== me.shift) { S.blocked.push({ id: nid('blk'), t: S.now, user: me.id, point: p.id, reason: 'shift' }); go('blocked', { point: p.id, sup: 'shift' }); return; }
  const st = pointStatus(p);
  if (st.k !== 'wait') { go('nothing', { point: p.id }); return; }
  S.phone.sel = { result: null, defect: '' };
  go('inspect', { point: p.id, sub: st.st.pending.id });

function doInspect() {
  const me = U(S.phone.user); const c = S.phone.ctx; const p = PT(c.point); const sel = S.phone.sel;
  if (!sel.result) { toast('เลือก "สะอาด" หรือ "ไม่สะอาด"'); return; }
  if (sel.result === 'fail' && !sel.defect.trim()) { toast('ไม่สะอาด ต้องเขียนข้อบกพร่อง'); return; }
  if (!S.phone.net) { go('failed', { ...c, retry: { kind: 'ins' }, what: `ตรวจ ${p.name} · ${sel.result === 'pass' ? 'สะอาด' : 'ไม่สะอาด'}` }); return; }
  const sub = S.subs.find((s) => s.id === c.sub);
  const st = pointStatus(p);
  if (st.k !== 'wait' || !st.st.pending || st.st.pending.id !== sub.id) { go('nothing', { point: p.id }); return; }
  const dist = gpsRead();
  S.insps.push({ id: nid('ins'), point: p.id, user: me.id, sub: sub.id, t: S.now, round: sub.round, result: sel.result, defect: sel.defect.trim(), dist, flag: dist > CFG.radius });
  S.flash = p.id;
  go('inspectDone', { point: p.id, result: sel.result, defect: sel.defect.trim() });
}
function retry() {
  const r = S.phone.ctx.retry; if (!S.phone.net) { toast('ยังไม่มีสัญญาณ ลองเดินไปตรงที่มีสัญญาณ'); return; }
  const ctx = { ...S.phone.ctx }; delete ctx.retry; delete ctx.what; S.phone.ctx = ctx;
  if (r.kind === 'att') doAttendance(r.type); else if (r.kind === 'sub') doSubmit(); else doInspect();
}

function roundHistory(p, sh = shiftAt(S.now)) {
  const area = A(p.area); if (sh.type === 'N' && area.pattern === 'D') return [];
  return (p.win[sh.type] || []).map((w, i) => {
    const ab = winAbs(sh, w); const key = roundKey(sh, i);
    if (ab.s > S.now) return { w: ab, label: 'ยังไม่ถึงรอบ', k: 'notyet' };
    const st = roundState(p, key, S.now);
    const cur = roundsNow(p, S.now).cur; const isCur = cur && cur.key === key;
    let label, k;
    if (st.lastIns?.result === 'fail' && !st.pending) { label = isCur ? 'ต้องแก้ไข' : 'ไม่ได้แก้'; k = 'rework'; }
    else if (st.pending) { label = isCur ? 'รอตรวจ' : 'ไม่ได้ตรวจ'; k = 'wait'; }
    else if (st.lastIns?.result === 'pass') { label = 'ตรวจผ่าน'; k = 'pass'; }
    else { label = isCur ? (S.now > ab.e ? 'เลยรอบ' : 'ยังไม่ทำ') : 'ไม่ได้ทำ'; k = isCur && S.now <= ab.e ? 'todo' : 'over'; }
    const late = st.subs.find((s) => s.kind === 'late');
    return { w: ab, label: label + (isCur ? ' · รอบปัจจุบัน' : '') + (late ? ` · ส่งช้า ${dur(late.late)}` : ''), k, st };
  });
}

      <span class="note">ไม่มีพิกัด GPS ดิบ มีแค่ระยะห่างและผลในรัศมี/นอกรัศมี · การส่งออกเก็บลงประวัติ Admin · ไฟล์ที่ดาวน์โหลดแล้วอยู่นอกการลบตามระยะเวลาเก็บข้อมูล · ต้นแบบนี้แสดงตัวอย่างข้อมูลในไฟล์ ไม่ดาวน์โหลดจริง</span></div>
    ${sheet(X.att, 'การลงเวลา', ['คน', 'Area', 'กะ', ...EV.map((e) => EVN[e]), 'ที่มา', 'GPS'], atRows)}
    ${sheet(X.sub, 'การส่งงาน', ['เวลา', 'จุด', 'Area', 'แม่บ้าน', 'ผล', 'Issue', 'ทำแทน', 'GPS'], subRows)}
    ${sheet(X.ins, 'การตรวจงาน', ['เวลา', 'หัวหน้า', 'จุด', 'ผล', 'ข้อบกพร่อง', 'GPS'], insRows)}`;
}

/* ───────── shell ───────── */

        <div class="sim-row"><label for="sim-sign">สแกนป้าย</label><select id="sim-sign" data-f="sign">${signOptions()}</select><button class="btn primary" type="button" data-a="scan">สแกน QR</button></div>
        <div class="sim-row"><span class="lbl">ตำแหน่ง</span><div class="seg">${[['in', 'ในรัศมี'], ['out', 'นอกรัศมี'], ['off', 'ปิด Location']].map(([k, l]) => `<button type="button" class="${P.gps === k ? 'on' : ''}" data-a="gps" data-id="${k}">${l}</button>`).join('')}</div></div>
        <div class="sim-row"><span class="lbl">สัญญาณ</span><div class="seg">${[['1', 'มี'], ['0', 'ไม่มี']].map(([k, l]) => `<button type="button" class="${String(+P.net) === k ? 'on' : ''}" data-a="net" data-id="${k}">${l}</button>`).join('')}</div></div>
        <span class="small muted">ในงานจริง แม่บ้านสแกน QR ด้วยกล้องมือถือแล้วหน้าเว็บเปิดเอง ส่วนนี้ใช้จำลองแทน</span>

  if (focus) { const el = document.querySelector(`[data-f="${focus}"]`); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) { /* not a text field */ } } }

/* ───────── events ───────── */
const ACT = {
  time: (v) => { S.now += +v; },
  setTime: (v) => { S.now = +v; },
  login, logout: () => { S.phone.user = null; go('login'); },
  home: () => go('home'),
  scan: () => scan(S.sign || document.getElementById('sim-sign').value),
  rescan: () => scan(S.phone.ctx.sign),
  scanFromList: (id) => scan(id),
  gps: (v) => { S.phone.gps = v; },
  net: (v) => { S.phone.net = v === '1'; },
  att: (v) => doAttendance(v),
  selStatus: (v) => { S.phone.sel.status = v; },
  tag: (v) => { const t = S.phone.sel.tags; const i = t.indexOf(v); i < 0 ? t.push(v) : t.splice(i, 1); },
  submit: doSubmit, retry,
  selResult: (v) => { S.phone.sel.result = v; },
  inspect: doInspect,
  tab: (v) => { S.office.tab = v; },
  filter: (v) => { S.office.filter = S.office.filter === v ? null : v; },
  issueOnly: () => { S.office.issueOnly = !S.office.issueOnly; },
  openPoint: (v) => { S.office.open = S.office.open === v ? null : v; },
  editAtt: (v) => { if (!v) { S.office.editAtt = null; return; } const [user, shift, type] = v.split('|'); const rec = attRec(user, shift); S.office.editAtt = { user, shift, type: type || EV.find((e) => !rec?.ev[e]) || 'SHIFT_IN', time: '', reason: '', err: '' }; S.office.tab = 'att'; },
  saveAtt: () => {
    const ed = S.office.editAtt; const t0 = parseT(ed.time);
    if (t0 == null) { ed.err = 'กรอกเวลาเป็น ชม:นาที เช่น 06:58'; return; }
    if (!ed.reason.trim()) { ed.err = 'ต้องใส่เหตุผลทุกครั้ง'; return; }
    const d = parseInt(ed.shift, 10), type = ed.shift.slice(-1);
    let t = d * 1440 + t0; if (type === 'N' && t0 < 720) t += 1440; if (type === 'D' && t0 < 300) t += 1440;
    let rec = attRec(ed.user, ed.shift); if (!rec) { rec = { id: nid('att'), user: ed.user, shift: ed.shift, ev: {} }; S.att.push(rec); }
    const before = rec.ev[ed.type] ? fmt(rec.ev[ed.type].t) : '–';
    rec.ev[ed.type] = { t, dist: null, flag: false, src: rec.ev[ed.type] ? 'admin-edit' : 'admin-add' };
    audit(before === '–' ? 'เพิ่มการลงเวลา' : 'แก้การลงเวลา', `${U(ed.user).name} · ${A(U(ed.user).area).name} · ${EVN[ed.type]} ${SHIFT_SHORT[type]} ${DATES[d]}`, before, fmt(t), ed.reason.trim());
    S.office.editAtt = null; toast('บันทึกแล้ว รายการนี้มีป้าย "แก้โดย Admin"');
  },
  coverFor: (v) => { S.office.coverFor = S.office.coverFor === v ? null : v; S.office.tab = 'flags'; },
  assignCover: (v) => { const [user, area] = v.split('|'); const sh = shiftAt(S.now); S.covers.push({ id: nid('cov'), user, area, shift: sh.key, at: S.now }); audit('มอบหมายทำแทน', `${U(user).name} → ${A(area).name} · ${SHIFT_NAME[sh.type]} ${DATES[sh.day]}`, '–', 'มอบหมาย'); S.office.coverFor = null; toast(`${U(user).name} สแกนจุดของ ${A(area).name} ได้แล้วจนหมดกะ`); },
  cancelCover: (v) => { const c = S.covers.find((x) => x.id === v); c.cancelled = true; audit('ยกเลิกทำแทน', `${U(c.user).name} → ${A(c.area).name}`, 'มอบหมาย', 'ยกเลิก'); },
  flagView: (v) => { S.office.flagView = v; },
  ack: (v) => { S.acks[v] = S.now; const f = allFlags().find((x) => x.id === v); audit('ปิดเตือน', `${f.type} · ${U(f.who).name} ${fmt(f.t)}`, 'ยังไม่ได้คุย', 'คุยแล้ว'); },
  areaSel: (v) => { S.office.areaSel = v; S.office.winEd = null; },
  toggleArea: () => { const a = A(S.office.areaSel); a.active = !a.active; audit(a.active ? 'เปิดใช้งาน Area' : 'ปิดใช้งาน Area', a.name, a.active ? 'ปิด' : 'เปิด', a.active ? 'เปิด' : 'ปิด'); },
  winEd: (v) => { if (!v) { S.office.winEd = null; return; } const [p, t] = v.split('|'); S.office.winEd = { p, t, s: '', e: '', err: '' }; },
  addWin: () => {
    const ed = S.office.winEd; const p = PT(ed.p); const s = parseT(ed.s), e = parseT(ed.e);
    if (s == null || e == null) { ed.err = 'กรอกเวลาเป็น ชม:นาที'; return; }
    const norm = (x) => (ed.t === 'N' ? (x < 420 ? x + 1440 : x) : x);
    const ns = norm(s), ne = norm(e); const lo = ed.t === 'D' ? 420 : 1140, hi = lo + 720;
    if (ne <= ns) { ed.err = 'เวลาสิ้นสุดต้องหลังเวลาเริ่ม'; return; }
    if (ns < lo || ne > hi) { ed.err = `ช่วงต้องอยู่ใน${SHIFT_NAME[ed.t]}`; return; }
    if (p.win[ed.t].some((w) => ns < norm(w[1]) && norm(w[0]) < ne)) { ed.err = 'ช่วงนี้ซ้อนกับช่วงที่มีอยู่'; return; }
    p.win[ed.t].push([s, e]); p.win[ed.t].sort((a, b) => norm(a[0]) - norm(b[0]));
    audit('เพิ่มช่วงรอบ', `${p.name} · ${A(p.area).name} · ${SHIFT_SHORT[ed.t]}`, '–', `${fmt(s)}–${fmt(e)}`); S.office.winEd = null;
  },
  delWin: (v) => { const [pid, t, i] = v.split('|'); const p = PT(pid); const w = p.win[t].splice(+i, 1)[0]; audit('ลบช่วงรอบ', `${p.name} · ${A(p.area).name} · ${SHIFT_SHORT[t]}`, `${fmt(w[0])}–${fmt(w[1])}`, '–'); toast('ลบช่วงแล้ว การ์ดคำนวณใหม่ทันที'); },
  regenQr: (v) => { audit('ออก QR ใหม่', `${v} ${PT(v).name}`, 'QR เดิม', 'QR ใหม่ · ป้ายเดิมสแกนไม่ได้'); toast(`ออก QR ใหม่ของ ${v} แล้ว ต้องพิมพ์ป้ายใหม่ไปติด`); },
  accRole: (v) => { S.office.acc.role = v; },
  addAcc: () => { S.office.acc.add = S.office.acc.add ? null : { role: 'cleaner', name: '', emp: '', phone: '', slot: '', err: '' }; },
  saveAcc: () => {
    const f = S.office.acc.add; const ph = f.phone.replace(/\D/g, '');
    if (!f.name.trim() || !f.emp.trim()) { f.err = 'กรอกชื่อและรหัสพนักงาน'; return; }
    if (S.users.some((u) => u.emp === f.emp.trim())) { f.err = 'รหัสพนักงานนี้มีอยู่แล้ว'; return; }
    if (ph.length !== 10) { f.err = 'เบอร์โทรต้องมี 10 หลัก'; return; }
    if (!f.slot) { f.err = f.role === 'cleaner' ? 'เลือก Area และกะ' : 'เลือกตึกและกะ'; return; }
    const [x, t] = f.slot.split('|');
    const u = { id: nid('u'), emp: f.emp.trim(), name: f.name.trim(), role: f.role, phone: ph, shift: t, active: true, ...(f.role === 'cleaner' ? { area: x } : { bld: x }) };
    S.users.push(u); audit('สร้างบัญชี', `${u.name} (${u.emp}) · ${f.role === 'cleaner' ? 'แม่บ้าน' : 'หัวหน้า'}`, '–', f.role === 'cleaner' ? `${A(x).name} · ${SHIFT_SHORT[t]}` : `ตึก ${x} · ${SHIFT_SHORT[t]}`);
    S.office.acc.add = null; toast(`สร้างบัญชี ${u.name} แล้ว login ด้วย ${u.emp} + เบอร์โทร`);
  },
  phoneFor: (v) => { S.office.acc.phoneFor = v || null; S.office.acc.newPhone = ''; S.office.acc.phoneErr = ''; },
  savePhone: () => { const O = S.office.acc; const ph = (O.newPhone || '').replace(/\D/g, ''); if (ph.length !== 10) { O.phoneErr = 'เบอร์โทรต้องมี 10 หลัก'; return; } const u = U(O.phoneFor); u.phone = ph; audit('แก้เบอร์โทร', `${u.name} (${u.emp})`, 'เบอร์เดิม', 'เบอร์ใหม่ (ไม่แสดงเบอร์)'); if (S.phone.user === u.id) { S.phone.user = null; go('login'); } O.phoneFor = null; toast(`แก้เบอร์ของ ${u.name} แล้ว ทุกเครื่องของ ${u.name} หลุดออกจากระบบ`); },
  toggleUser: (v) => { const u = U(v); u.active = !u.active; audit(u.active ? 'เปิดใช้งานบัญชี' : 'ปิดใช้งานบัญชี', `${u.name} (${u.emp})`, u.active ? 'ปิด' : 'เปิด', u.active ? 'เปิด' : 'ปิด'); if (!u.active && S.phone.user === u.id) { S.phone.user = null; go('login'); toast(`${u.name} หลุดออกจากระบบทุกเครื่อง`); } },
  export: () => { const X = S.office.xl; const sets = [X.att && 'การลงเวลา', X.sub && 'การส่งงาน', X.ins && 'การตรวจงาน'].filter(Boolean); if (!sets.length) { toast('เลือกอย่างน้อย 1 ชุด'); return; } const d = shiftAt(S.now).day; audit('ส่งออก Excel', sets.join(' + '), '–', `${DATES[d - 1]} – ${DATES[d]} · ทุกตึก`); toast('บันทึกการส่งออกลงประวัติ Admin แล้ว (ต้นแบบไม่ดาวน์โหลดไฟล์จริง)'); },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = ACT[el.dataset.a]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.id); render();
});
function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }
document.addEventListener('input', (e) => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return; const v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (f === 'emp' || f === 'phone') { S.phone.form[f] = v; return; }
  if (f === 'note' || f === 'defect') { S.phone.sel[f] = v; return; }
  if (f === 'sign') { S.sign = v; return; }
  if (f.startsWith('ed.')) { S.office.editAtt[f.slice(3)] = v; if (e.target.tagName === 'SELECT') render(); return; }
  if (f.startsWith('winEd.')) { S.office.winEd[f.slice(6)] = v; return; }
  if (f === 'acc.q') { S.office.acc.q = v; render(); return; }
  if (f.startsWith('acc.')) { setPath(S.office, f, v); if (e.target.tagName === 'SELECT') render(); return; }
  if (f.startsWith('xl.')) { S.office.xl[f.slice(3)] = v; render(); return; }
});
document.addEventListener('change', (e) => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  if (f === 'who') { const u = U(e.target.value); S.phone.user = null; S.phone.form = { emp: u ? u.emp : '', phone: u ? u.phone : '' }; S.phone.err = ''; go('login'); render(); return; }
  if (f === 'bld') { S.office.bld = e.target.value; render(); return; }
  if (f === 'auditType') { S.office.auditType = e.target.value; render(); return; }
  if (f === 'sign') { S.sign = e.target.value; }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && S.phone.screen === 'login' && (e.target.dataset?.f === 'emp' || e.target.dataset?.f === 'phone')) { login(); render(); } });
S.phone.user = 'u1'; go('home'); S.sign = 'AR01-01';
render();
</script>
